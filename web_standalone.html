  직접 수정하지 마세요. frontend/ 를 고친 뒤 npm run build:standalone 을 실행하세요.

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업체별 업무 일정 v5</title><style>
/* 본문 폰트는 앱에 동봉한다. Pretendard 를 지정만 하고 번들하지 않으면 Windows 에서는
   맑은고딕으로 조용히 폴백되어, 의도한 조판이 사용자 화면에 한 번도 나타나지 않는다.
   Pretendard / SIL Open Font License 1.1 — frontend/fonts/LICENSE.txt */
@font-face{
  font-family:"Pretendard Variable";
  src:url("frontend/fonts/PretendardVariable.woff2") format("woff2-variations");
  font-weight:45 920;font-style:normal;font-display:swap;
}
:root{
  /* 색 — KRDS 라이트 테마 토큰 유지. 시간 긴급도는 파랑(예정) -> 주황(오늘) -> 빨강(지남)
     한 축, 초록은 완료에만. 새 골격에서 달라지는 것은 색이 아니라 '창이 없다'는 사실이다. */
  --bg:#f4f5f6;--panel:#fff;--sub:#f7f8f9;--ink:#1e2124;--muted:#58616a;--line:#e6e8ea;
  --line-strong:#cdd1d5;
  --accent:#0b50d0;        /* primary-60  (6.83) */
  --accent-line:#256ef4;   /* primary-50  Today 테두리/바 */
  --accent-soft:#ecf2fe;   /* primary-5 */
  --today:#e3ecfd;
  --danger:#bd2c0f;--danger-soft:#fdefec;
  --sat:#1a4fa0;          /* 토요일 — 근무일이 아니라는 표시 */
  --warn:#8a5c00;--warn-soft:#fff3db;
  --done:#267337;--done-soft:#eaf6ec;
  --shadow:0 10px 34px rgba(19,20,22,.20);
  --r:16px;

  /* 조각(무장식 창)의 유리 질감. Windows 는 창 뒤 바탕화면을 흐릿하게 만들 수 없으므로
     (backdrop-filter 는 페이지 내용에만 듣는다) 유리를 거의 불투명하게 깐다 —
     투명도를 남기면 바탕화면 아이콘이 글자 사이로 그대로 비쳐 읽을 수 없다. */
  --glass:rgba(249,250,252,.97);
  --glass-line:rgba(255,255,255,.85);
  --cell:rgba(255,255,255,.92);
  --cell-dim:rgba(244,246,248,.6);

  /* 타입 스케일 — KRDS PC 토큰. 13px 하한(발주서 §19.3). */
  --fs-xs:13px;
  --fs-sm:15px;
  --fs-md:17px;
  --fs-lg:19px;

  --ctl-h:40px;
  --ctl-h-sm:36px;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{font-size:var(--fs-sm);line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(11,80,208,.28);outline-offset:2px}

/* ── 데스크 ────────────────────────────────────────────────────────────────
   브라우저·검사(파라미터 없음): 배경화면을 그려 두고 세 조각을 함께 배치한다.
   Tauri(?w=cal|mini|status): 조각 하나가 곧 투명 창이다 — 배경은 진짜 바탕화면이다. */
body{
  background:
    radial-gradient(1200px 500px at 75% -10%, #ffe9c7 0%, transparent 55%),
    radial-gradient(1600px 900px at 20% 110%, #1e5b48 0%, transparent 60%),
    linear-gradient(180deg,#8db8d8 0%, #bcd3e2 38%, #dde5d2 62%, #6f9c7c 100%);
  background-attachment:fixed;
}
.desk{height:100vh;padding:16px;display:grid;gap:14px;
  grid-template-columns:minmax(0,1fr) 352px;grid-template-rows:minmax(0,1.35fr) minmax(0,1fr)}
.piece-cal{grid-row:1/3}
.piece{min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);
  box-shadow:var(--shadow)}
/* 유리 위 스크롤바 — 기본 스크롤바는 흰 기둥으로 도드라진다 */
.calendar-scroll::-webkit-scrollbar,.due-list::-webkit-scrollbar,.vendor-board::-webkit-scrollbar,
.budget-board::-webkit-scrollbar,.status-scroll::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:8px;height:8px}
.calendar-scroll::-webkit-scrollbar-thumb,.due-list::-webkit-scrollbar-thumb,.vendor-board::-webkit-scrollbar-thumb,
.budget-board::-webkit-scrollbar-thumb,.status-scroll::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:rgba(30,33,36,.22);border-radius:999px}
.calendar-scroll::-webkit-scrollbar-track,.due-list::-webkit-scrollbar-track,.vendor-board::-webkit-scrollbar-track,
.budget-board::-webkit-scrollbar-track,.status-scroll::-webkit-scrollbar-track,.modal-body::-webkit-scrollbar-track{background:transparent}

/* 조각 하나만 보이는 창 모드. 바깥 여백은 그림자가 그려질 실제 투명 영역이다. */
body.win-mode{background:transparent;overflow:hidden}
body.win-mode .desk{display:flex;flex-direction:column;padding:10px;height:100vh}
body.win-mode .piece{flex:1;min-height:0;height:auto}
body.mode-cal #pieceMini,body.mode-cal #pieceStatus{display:none}
body.mode-mini #pieceCal,body.mode-mini #pieceStatus{display:none}
body.mode-status #pieceCal,body.mode-status #pieceMini{display:none}
/* 입력 창(pop): 조각은 없고 모달이 곧 창이다. */
body.mode-pop{background:transparent;overflow:hidden}
body.mode-pop .desk{display:none}
body.mode-pop .modal-bg{background:transparent;padding:10px;align-items:stretch;justify-content:stretch}
body.mode-pop .modal{width:100%;max-height:100%;box-shadow:0 18px 56px rgba(0,0,0,.34)}
/* pop 안에서 두 번째 모달(상세→지출 등)이 겹칠 때만 살짝 어둡게 */
body.mode-pop .modal-bg.show~.modal-bg.show{background:rgba(19,20,22,.28);align-items:center;justify-content:center}
body.mode-pop .modal-bg.show~.modal-bg.show .modal{width:min(560px,100%);max-height:92%}

/* ── 공용 버튼 ── */
.btn{height:var(--ctl-h);border:1px solid var(--line-strong);background:#fff;border-radius:9px;padding:0 10px;font-size:var(--fs-sm);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f4f5f6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#083891;border-color:#083891}
.btn.icon{width:var(--ctl-h);padding:0}.btn.danger{color:var(--danger)}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* 조각 머리의 얇은 버튼 — 유리 위에 놓이는 컨트롤 */
.pbtn{height:32px;border:1px solid rgba(30,33,36,.12);background:rgba(255,255,255,.75);border-radius:8px;
  padding:0 11px;font-size:var(--fs-xs);font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pbtn:hover{background:#fff}
.pbtn.icon{width:32px;padding:0;justify-content:center}
.pbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pbtn.primary:hover{background:#083891}

/* 조각을 끄는 손잡이. 501줄 어디에도 cursor:move 가 없어서 "옮길 수 있다"는 사실이
   화면에 한 번도 나타나지 않았다. 여섯 점은 창 손잡이의 보편 관례다. */
.grip{width:10px;height:16px;flex:0 0 auto;cursor:move;
  background-image:radial-gradient(circle,rgba(30,33,36,.30) 1.2px,transparent 1.3px);
  background-size:5px 5px;background-position:0 2px}
.sheet-head,.mini-head{cursor:move}
.mini-tools,.mini-tools *{cursor:default}

/* ── ① 달력 시트 ── */
.sheet-head{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:12px 14px 8px;
  -webkit-user-select:none;user-select:none}
.month-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;min-width:0;white-space:nowrap}
.cal-nav{display:flex;align-items:center;gap:4px}
.sheet-head .hint{flex:1;text-align:right}
.hint{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weekdays{flex:0 0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:0 10px}
.weekdays div{padding:3px 8px 4px;font-size:var(--fs-xs);color:var(--muted);font-weight:700}
.weekdays div:first-child{color:var(--danger)}
.weekdays div:last-child{color:var(--sat)}
/* 격자는 창에서 역산한다. 칸 높이를 112px 로 못박아 두었더니 6주 달에서 109px 이
   모자라 한 주가 스크롤 밖으로 밀려났다 — 지난달 말과 이번 주가 조용히 사라졌다.
   minmax(0,1fr) 이면 6주 달은 94px, 5주 달은 113px 로 저절로 맞고 스크롤이 없다. */
.calendar-scroll{flex:1;min-height:0;overflow:hidden;padding:0 10px 10px}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:3px;height:100%}
.day{position:relative;min-height:0;border-radius:10px;background:var(--cell);padding:3px 5px 4px;overflow:hidden}
.day:hover{background:#fff}
.day.out{background:var(--cell-dim)}
.day.out .day-num{color:rgba(30,33,36,.58)}
.day.today{background:#fff;box-shadow:inset 0 0 0 2px var(--accent-line)}
.day-head{height:21px;display:flex;align-items:center;gap:4px}
.day-num{min-width:21px;height:21px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700}
/* 근무일/비근무일. 일요일·공휴일 빨강은 한국 달력 관례, 토요일 파랑도 마찬가지다.
   토요일에 색이 없으면 마감일이 근무일인지 한눈에 안 보인다. */
.sun .day-num,.hol .day-num{color:var(--danger)}
.sat .day-num{color:var(--sat)}
.today .day-num{background:var(--accent);color:#fff}
.hol-name{font-size:var(--fs-xs);color:var(--danger);font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 완료 건은 칸 안 한 줄을 영구히 먹었다. 초록 체크 하나로 접고, 누르면 그 날 목록이 열린다. */
.done-mark{margin-left:auto;flex:0 0 auto;min-width:19px;height:19px;border:0;border-radius:5px;
  background:var(--done-soft);color:var(--done);font-size:var(--fs-xs);font-weight:700;display:grid;place-items:center;padding:0 3px;line-height:1}
.done-mark:hover{background:#d7ecdc}
/* 칸이 110px 아래로 좁아지면 글자를 포기하고 점으로 물러난다 — 84px 칸에 13px 한글은
   두 글자밖에 못 담는다. 점은 누르면 바로 그 건이 열리고, 숫자는 그 날 건수다. */
.dots{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:4px}
.dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;flex:0 0 auto;background:var(--accent)}
.dot.overdue{background:var(--danger)}
.dot.today{background:#a86f00}
.dot.planned{background:transparent;border:1.5px dashed var(--line-strong)}
.dot:hover{outline:2px solid var(--accent-line);outline-offset:1px}
.dot-n{font-size:var(--fs-xs);color:var(--muted);font-weight:700;margin-left:2px}
.more{height:16px;width:100%;border:0;background:transparent;text-align:left;padding:0 0 0 8px;
  font-size:var(--fs-xs);color:var(--muted);font-weight:700;display:flex;align-items:center}
.more:hover{color:var(--accent)}
.day-list{display:grid;gap:6px}
.events{display:grid;gap:3px;margin-top:2px}
/* 칩은 한 줄이다. 두 줄로 흘리면 칸 높이가 들쭉날쭉해져 격자가 깨지고, 한 칸에 두 건이
   못 들어간다. 넘치는 이름은 …로 줄이고 전문은 title 툴팁과 그 날 목록에 있다. */
.event{width:100%;display:flex;align-items:center;gap:5px;border:0;background:rgba(255,255,255,.94);
  border-radius:6px;height:23px;padding:0 5px 0 8px;font-size:var(--fs-xs);text-align:left;color:var(--ink);
  white-space:nowrap;overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(19,20,22,.06)}
.event:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:6px 0 0 6px;background:var(--accent)}
.event:hover{background:#fff}
.ev-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-d{flex:0 0 auto;font-size:var(--fs-xs);font-weight:700}
.event.overdue{background:var(--danger-soft);color:var(--danger)}
.event.overdue:before{background:var(--danger)}
.event.today{background:var(--warn-soft);color:var(--warn)}
.event.today:before{background:var(--warn)}
/* 예상 마감 — 절차 offset 으로 미리 깔아 둔 칸. 확정된 일정과 형태로 구분한다. */
.event.planned{background:rgba(255,255,255,.55);border:1px dashed var(--line-strong);color:var(--muted)}
.event.planned:before{display:none}
.event.manual:not(.overdue):not(.today):not(.planned):before{background:#8a949e}
.event[draggable="true"]{cursor:grab}
.event.dragging{opacity:.45}
.day.drop-ok{box-shadow:inset 0 0 0 2px var(--accent-line);background:rgba(236,242,254,.85)}
/* 기간 일정 — 시작~종료 모든 날짜 칸에 칩이 선다. 시작 칸만 왼쪽을, 종료 칸만 오른쪽을
   둥글게 하고 이어지는 칸은 톤을 낮춰 하나의 띠로 읽히게 한다. 클릭 대상은 매일 살아 있다. */
.event.period{border-radius:0;margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:7px}
.event.period.start{border-top-left-radius:6px;border-bottom-left-radius:6px;margin-left:0;padding-left:9px}
.event.period.end{border-top-right-radius:6px;border-bottom-right-radius:6px;margin-right:0}
.event.period.cont{color:var(--muted)}
.event.period.cont:before{display:none}
/* 행사 기간 띠 — "이 날 할 일"과 "이 행사가 도는 중"은 층위가 다르다. */
.day-bands{display:grid;gap:2px;margin-top:3px}
.day-band{display:block;height:17px;line-height:17px;padding:0 6px;font-size:var(--fs-xs);font-weight:700;
  color:var(--accent);background:var(--accent-soft);border-radius:0;
  margin-left:-10px;margin-right:-10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-band.start{border-top-left-radius:999px;border-bottom-left-radius:999px;margin-left:0;padding-left:9px}
.day-band.end{border-top-right-radius:999px;border-bottom-right-radius:999px;margin-right:0}
.day.out .day-band{opacity:.45}
.add-hint{position:absolute;right:6px;bottom:3px;font-size:var(--fs-xs);color:var(--muted);opacity:0;pointer-events:none}
.day:hover .add-hint{opacity:1}

/* ── ② 미니 대시보드 ── */
.mini-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 11px 8px;-webkit-user-select:none;user-select:none}
.piece-title{font-size:var(--fs-sm);font-weight:700;letter-spacing:-.01em;flex:0 0 auto}
.mini-head .hint{flex:1;text-align:right;min-width:0}
.tabs{display:flex;gap:3px;padding:3px;background:rgba(30,33,36,.08);border-radius:9px;width:max-content;flex:0 0 auto}
.tab{border:0;background:transparent;border-radius:7px;padding:5px 9px;font-size:var(--fs-xs);font-weight:700;color:var(--muted);white-space:nowrap}
.tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.horizon{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--muted);flex:0 0 auto;margin-left:auto}
.horizon select,.horizon input{height:30px;border:1px solid rgba(30,33,36,.12);background:rgba(255,255,255,.8);border-radius:8px;padding:0 4px;font-size:var(--fs-xs);font-weight:700}
.horizon input{width:64px}
/* 추가·검색 한 칸 — 치면 다섯 종류를 찾고, 없으면 그대로 일정을 만든다 */
.omni-box{position:relative;flex:0 0 auto;margin:0 11px 8px;display:flex;align-items:center;gap:7px;
  background:#fff;border:1px solid rgba(30,33,36,.12);border-radius:999px;padding:0 5px 0 12px;height:38px}
.omni-box>.ico{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
.omni-box input{flex:1;min-width:0;border:0;background:transparent;font-size:var(--fs-xs);height:100%}
.omni-box input:focus-visible{outline:none}
.omni-box:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(11,80,208,.14)}
#omniAdd{width:28px;height:28px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:17px;line-height:1;flex:0 0 auto;display:grid;place-items:center;padding:0}
#omniAdd:hover{background:#083891}
.omni-list{position:absolute;z-index:80;left:0;right:0;top:calc(100% + 5px);max-height:340px;overflow:auto;
  background:#fff;border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 32px rgba(19,20,22,.2);padding:5px}
.omni-kind{padding:7px 9px 3px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;color:var(--muted)}
.omni-opt{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 9px;font-size:var(--fs-xs)}
.omni-opt b{display:block;font-size:var(--fs-sm);font-weight:700}
.omni-opt small{display:block;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omni-opt:hover,.omni-opt.active{background:var(--accent-soft)}
.omni-opt.create{color:var(--accent);font-weight:700;border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px;padding-top:9px}
.omni-empty{padding:9px 10px;font-size:var(--fs-xs);color:var(--muted)}
.due-list{flex:1;min-height:0;padding:2px 11px 8px;display:grid;grid-auto-rows:max-content;gap:5px;overflow:auto;align-content:start}
/* 3단 92.5px 카드를 2줄 58px 로 눌렀다 — 같은 창에 두 배 이상이 들어간다.
   오른쪽 체크는 목록에서 바로 완료하는 길이다(되돌리기 그대로 붙는다). */
.due-card{background:rgba(255,255,255,.94);box-shadow:0 1px 2px rgba(19,20,22,.07);border-radius:10px;
  height:58px;padding:0 8px 0 11px;display:flex;align-items:center;gap:8px;position:relative}
.due-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:10px 0 0 10px;background:var(--accent)}
.due-card:hover{background:#fff}
.due-card.today:before{background:var(--warn)}
.due-card.overdue:before{background:var(--danger)}
.dc-open{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;
  display:flex;align-items:center;gap:8px;height:100%}
.dc-main{flex:1;min-width:0;display:grid;gap:1px}
.dc-l1{display:block;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-l2{display:block;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-dday{flex:0 0 auto;min-width:46px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700}
.due-card.today .dc-dday{background:var(--warn-soft);color:var(--warn)}
.due-card.overdue .dc-dday{background:var(--danger-soft);color:var(--danger)}
.dc-ok{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line-strong);background:#fff;
  color:var(--muted);display:grid;place-items:center;font-size:15px;font-weight:700;padding:0}
.dc-ok:hover{background:var(--done-soft);border-color:var(--done);color:var(--done)}
/* 지남 건수 — "지금 급한 게 있나"를 말하는 화면상 유일한 한 곳 */
.overdue-pill{height:24px;padding:0 10px;border-radius:999px;background:var(--danger-soft);color:var(--danger);
  font-size:var(--fs-xs);font-weight:700;display:inline-flex;align-items:center;white-space:nowrap;flex:0 0 auto}
.overdue-pill.zero{background:rgba(30,33,36,.07);color:var(--muted)}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:var(--fs-xs)}
.mini-tools{flex:0 0 auto;display:flex;gap:4px;padding:7px 9px;border-top:1px solid rgba(30,33,36,.08);
  -webkit-user-select:none;user-select:none}
.tool{flex:1;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);
  font-size:var(--fs-xs);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tool:hover{background:rgba(30,33,36,.07);color:var(--ink)}

/* ── ③ 현황 ── */
.status-scroll{flex:1;min-height:0;overflow:auto;padding:0 11px 10px;display:grid;grid-auto-rows:max-content;gap:8px;align-content:start}
.st-sec{background:rgba(255,255,255,.9);border-radius:12px;box-shadow:0 1px 3px rgba(19,20,22,.07);overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.st-sec>.st-head{grid-column:1}
.st-sec>.st-face,.st-sec>.vendor-board,.st-sec>.budget-board{grid-column:1/-1}
/* 빈 상태를 문장이 아니라 그 줄에서 바로 여는 버튼으로 만든다. 별도 버튼 행을 두었더니
   현황 창(341x195) 안에서 두 번째 버튼이 잘렸다 — 한 줄이면 넉넉히 들어간다. */
.st-mk{grid-column:2;height:26px;margin-right:11px;border:1px solid var(--accent);background:#fff;
  border-radius:999px;padding:0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--accent);white-space:nowrap}
.st-mk:hover{background:var(--accent-soft)}
.st-sec.is-empty>.st-face{display:none}
.st-sec.is-empty>.st-head .st-caret{visibility:hidden}
.st-head{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:10px 12px;text-align:left}
.st-head:hover{background:#fff}
.st-title{font-size:var(--fs-sm);font-weight:700}
.st-sum{flex:1;text-align:right;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-caret{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:0 0 auto;transition:.15s}
.st-head[aria-expanded="true"] .st-caret{transform:rotate(-135deg)}
.st-face{padding:0 12px 10px;display:grid;gap:8px}
.st-row{display:grid;gap:4px}
.st-row .l1{display:flex;align-items:baseline;gap:7px;font-size:var(--fs-xs)}
.st-row .l1 b{font-size:var(--fs-sm);font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-row .l1 span{color:var(--muted);margin-left:auto;white-space:nowrap}
.st-meter{display:flex;align-items:center;gap:8px}
.st-meter .track{flex:1;height:6px;border-radius:999px;background:rgba(30,33,36,.1);overflow:hidden;display:flex}
.st-meter .track i{display:block;height:100%}
.st-meter .n{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}

/* ── 업체별/행사별 보드 (미니·현황 안에서 그대로 쓴다) ── */
.vendor-board{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:2px 11px 8px;display:grid;grid-auto-rows:max-content;gap:6px;align-content:start}
.st-sec .vendor-board,.st-sec .budget-board{padding:0 10px 10px;max-height:44vh}
.board-row{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.board-row.open{border-color:var(--line-strong)}
.board-head{width:100%;text-align:left;border:0;background:transparent;padding:10px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px}
.board-head:hover{background:#fafbfc}
.bh-id{min-width:0;grid-column:1;grid-row:1}
.bh-dday{grid-column:2;grid-row:1}
.bh-stat{grid-column:1/-1;grid-row:2}
.bh-name{display:block;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-info{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-stat{grid-column:1/-1;min-width:0}
.bh-counts{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-counts b{color:var(--ink);font-weight:700}
.bh-late{color:var(--danger);font-weight:700;background:var(--danger-soft);border-radius:999px;padding:1px 7px;margin-left:4px}
.bh-money{color:var(--muted);font-weight:700}
.bh-bar{display:block;height:5px;border-radius:999px;background:#e6e8ea;margin-top:5px;overflow:hidden}
.bh-bar i{display:block;height:100%;background:var(--done);border-radius:999px}
.bh-next{display:none}
.bn-name{display:block;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn-name.muted{font-weight:500;color:var(--muted)}
.bn-date{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:3px}
.bh-dday{min-width:52px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700}
.bh-dday.today{background:var(--warn-soft);color:var(--warn)}
.bh-dday.overdue{background:var(--danger-soft);color:var(--danger)}
.bh-dday.undated{background:#f0f1f3;color:var(--muted)}
.board-items{display:none;padding:0 8px 8px;gap:5px;grid-template-columns:1fr}
.board-row.open .board-items{display:grid}
.board-item{width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--sub);padding:7px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px}
.board-item:hover{background:#f0f1f3}
.board-item.flat{background:#fff;border-style:dashed}
.board-item.add{background:#fff;border-style:dashed;color:var(--accent);font-weight:700;justify-items:start;display:block;text-align:left}
.board-item.add:hover{background:var(--accent-soft)}
.bi-name{display:block;font-size:var(--fs-xs);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi-sub{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi-steps{font-size:var(--fs-xs);color:var(--muted);font-weight:700}
.bi-dday{min-width:48px;text-align:center;font-size:var(--fs-xs);font-weight:700;border-radius:999px;padding:3px 7px;background:var(--accent-soft);color:var(--accent)}
.bi-dday.today{background:var(--warn-soft);color:var(--warn)}
.bi-dday.overdue{background:var(--danger-soft);color:var(--danger)}
.bi-dday.done{background:var(--done-soft);color:var(--done)}
.bi-dday.undated{background:#f0f1f3;color:var(--muted)}

/* ── 모달 = 입력 팝오버. 브라우저에서는 가운데 카드, pop 창에서는 창 그 자체. ── */
.modal-bg{position:fixed;inset:0;background:rgba(19,20,22,.45);display:none;align-items:center;justify-content:center;padding:15px;z-index:60}
.modal-bg.show{display:flex}
.modal{width:min(580px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 28px 80px rgba(0,0,0,.18);display:flex;flex-direction:column}
.modal.wide{width:min(790px,100%)}.modal.narrow{width:min(400px,100%)}
.modal-head{flex:0 0 auto;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:9px}
.modal-head h2{font-size:var(--fs-lg);margin:0}
.close{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px}
.modal-body{flex:1;min-height:0;overflow:auto;padding:14px}
.modal-foot{flex:0 0 auto;padding:10px 14px;border-top:1px solid var(--line);background:#f7f8f9;border-radius:0 0 16px 16px;display:flex;justify-content:flex-end;gap:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field.full{grid-column:1/-1}
.field label,.field .label{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:700;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid #cdd1d5;border-radius:8px;background:#fff;padding:9px 11px;font-size:var(--fs-sm)}
.field textarea{min-height:66px;resize:vertical}
.field-note{font-size:var(--fs-xs);color:var(--muted);margin-top:4px}

/* 상세 */
.detail-hero{display:grid;grid-template-columns:1fr auto;gap:10px}
.detail-vendor{font-size:var(--fs-lg);font-weight:700}
.detail-project{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.detail-dday{min-width:58px;height:46px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:var(--fs-md);font-weight:700}
.detail-dday.today{background:var(--warn-soft);color:var(--warn)}
.detail-dday.overdue{background:var(--danger-soft);color:var(--danger)}
.detail-dday.done{background:var(--done-soft);color:var(--done)}
.current-box{border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:11px}
.current-label{font-size:var(--fs-xs);color:var(--muted);font-weight:700}
.batch-note{margin-left:7px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.current-title{font-size:var(--fs-lg);font-weight:700;margin-top:3px}
.current-date{font-size:var(--fs-xs);color:var(--muted);margin-top:3px}
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.info{border:1px solid var(--line);border-radius:9px;padding:8px}
.info span{font-size:var(--fs-xs);color:var(--muted);display:block}
.info b{font-size:var(--fs-sm);display:block;margin-top:2px}
.steps{margin-top:12px}
.steps-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.steps-title{font-size:var(--fs-sm);color:var(--muted);font-weight:700}
.link{border:0;background:transparent;color:var(--accent);font-size:var(--fs-xs);font-weight:700;padding:0}
.step{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;align-items:center;min-height:40px;border-top:1px solid #e6e8ea}
.step:first-of-type{border-top:0}
.step-mark{width:22px;height:22px;border-radius:6px;background:#e6e8ea;color:#58616a;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700}
.step.done .step-mark{background:var(--done);color:#fff}
.step.current .step-mark{background:#fff;border:2px solid var(--accent);color:var(--accent)}
.step-name{font-size:var(--fs-sm);font-weight:700}
.step.done .step-name{color:#58616a}
.step.future .step-name{color:#33363d}
.step.current{background:#fafbfc}.step.current .step-name{font-weight:700}
.step-status{font-size:var(--fs-xs);white-space:nowrap;border-radius:999px;padding:3px 6px}
.step-status.done{background:#eef0f3;color:#58616a}
.step-status.current{background:var(--accent-soft);color:var(--accent);font-weight:700}
.step-status.future{background:#f4f5f6;color:#58616a}
.step.future .step-mark{background:#f4f5f6;color:var(--muted)}

/* 템플릿 */
.template-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px}
.template-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.template-item{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 10px;text-align:left;font-size:var(--fs-sm);font-weight:500}
.template-item:last-child{border-bottom:0}
.template-item.active{background:var(--accent-soft);color:var(--accent)}
.template-editor{border:1px solid var(--line);border-radius:10px;padding:10px}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.editor-title{font-size:var(--fs-sm);font-weight:700}
.proc-list{display:grid;gap:5px}
.proc-row{display:grid;grid-template-columns:58px minmax(0,1fr) 84px 64px;gap:5px;align-items:center}
.proc-row input{width:100%;height:var(--ctl-h-sm);border:1px solid var(--line);border-radius:7px;padding:0 6px;font-size:var(--fs-sm)}
.move{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.move button,.remove{height:32px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:var(--fs-xs)}
.remove{color:var(--danger)}

/* 설정 */
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.setting-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.setting-actions select{height:var(--ctl-h-sm);border:1px solid var(--line-strong);border-radius:8px;background:#fff;padding:0 8px;font-size:var(--fs-xs);max-width:15rem}
.setting-actions .btn:disabled{opacity:.5;cursor:default}
.setting-row:first-child{border-top:0}
.setting-copy b{display:block;font-size:var(--fs-sm)}
.setting-copy span{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.switch{position:relative;width:40px;height:23px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:999px;background:#d8ddda;transition:.18s}
.slider:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.18s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(17px)}

/* 토스트 + 되돌리기 */
.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#1e2124;color:#fff;padding:9px 11px;border-radius:9px;font-size:var(--fs-sm);opacity:0;transform:translateY(6px);pointer-events:none;transition:.18s;display:flex;align-items:center;gap:12px}
.toast-undo{border:0;background:transparent;color:#8fd0ff;font-weight:700;font-size:var(--fs-sm);padding:4px 8px;border-radius:7px;text-decoration:underline;text-underline-offset:3px;flex:0 0 auto}
.toast-undo:hover{background:rgba(255,255,255,.14)}
.toast.show{opacity:1;transform:translateY(0);pointer-events:auto}
.hidden{display:none!important}

/* 상세: 기록·첨부·절차 */
.detail-modal{width:min(720px,100%)}
.section-headline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.section-headline b{display:block;font-size:var(--fs-sm)}
.section-headline span{display:block;margin-top:2px;font-size:var(--fs-xs);color:var(--muted)}
.worklog-section,.attachment-section{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
.log-compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:stretch}
.log-compose textarea{min-height:66px;border:1px solid #cdd1d5;border-radius:9px;padding:8px 9px;font-size:var(--fs-sm);resize:vertical}
.worklog-list{display:grid;gap:6px;margin-top:8px;max-height:230px;overflow:auto}
.worklog-item{position:relative;border:1px solid var(--line);border-radius:9px;background:#f7f8f9;padding:9px 62px 9px 11px}
.worklog-time{font-size:var(--fs-xs);color:var(--muted)}
.worklog-text{font-size:var(--fs-sm);white-space:pre-wrap;margin-top:3px;line-height:1.45}
.worklog-item .tiny-link{position:absolute;right:9px;top:9px}
.section-empty{padding:10px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:var(--fs-xs);text-align:center}
.tiny-link{border:0;background:transparent;color:var(--accent);padding:2px 3px;font-size:var(--fs-xs);font-weight:700;cursor:pointer}
.tiny-link.danger{color:var(--danger)}
.file-btn{min-height:34px;height:34px;padding:0 10px;font-size:var(--fs-xs)}
.attachment-list{display:grid;gap:5px}
.attachment-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.file-icon{width:24px;height:24px;border-radius:6px;background:#eef0f3;color:var(--accent);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700}
.attachment-main{min-width:0}
.attachment-main b{display:block;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attachment-main small{display:block;margin-top:1px;color:var(--muted);font-size:var(--fs-xs)}
.attachment-note{font-size:var(--fs-xs);color:var(--muted);margin-top:6px;line-height:1.4}
.steps-head>div:first-child{min-width:0}
.steps-sub{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}

/* Lucide 아이콘 (ISC). 스프라이트는 index.html 안에 인라인으로 심는다 — Tauri 는 오프라인이다. */
.sprite{display:none}
.ico{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.close .ico{width:18px;height:18px}

/* 용어·항목 탭 */
.terms-note{font-size:var(--fs-xs);color:var(--muted);margin-bottom:10px;line-height:1.5}
.terms-preview{margin-top:12px;border:1px solid var(--accent-line, var(--line));background:var(--accent-soft);border-radius:10px;padding:11px 13px;display:grid;gap:4px}
.terms-preview b{font-size:var(--fs-xs);color:var(--accent);letter-spacing:.02em}
.terms-preview span{font-size:var(--fs-xs);color:var(--ink)}
#vfList .proc-row{grid-template-columns:58px minmax(0,1fr) 116px 64px}
#vfList select{height:var(--ctl-h-sm);border:1px solid var(--line);border-radius:7px;padding:0 6px;font-size:var(--fs-xs);background:#fff}
/* 업체·업무·일정을 한 모달에서 등록할 때 쓰는 일정 행 */
.ev-list{display:grid;gap:5px}
.ev-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 56px;gap:5px;align-items:center}
.ev-row.two{grid-template-columns:1fr 1fr}
.ev-row input{width:100%;height:var(--ctl-h-sm);border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:var(--fs-sm)}
.ev-row .remove{height:var(--ctl-h-sm);border:1px solid var(--line);background:#fff;border-radius:7px;font-size:var(--fs-xs);color:var(--danger);font-weight:500}
.ev-row .remove:hover{background:var(--danger-soft)}
/* 고른 업체 칩 */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chips:empty{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:var(--fs-xs);font-weight:700}
.chip button{width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:15px;line-height:1;display:grid;place-items:center}
.chip button:hover{background:rgba(11,80,208,.16)}
/* 업체별 개별 조정 */
.pv-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 70px;gap:5px;align-items:center}
.pv-row input{width:100%;height:var(--ctl-h-sm);border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:var(--fs-sm)}
.pv-name{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-row.custom input{border-color:var(--accent-line);background:var(--accent-soft)}
.pv-reset{height:var(--ctl-h-sm);border:1px solid var(--line);background:#fff;border-radius:7px;font-size:var(--fs-xs);font-weight:500;color:var(--muted)}
.pv-row.custom .pv-reset{color:var(--accent);border-color:var(--accent-line)}
.pv-reset[disabled]{opacity:.45;cursor:default}
.bi-row{grid-template-columns:110px minmax(0,1fr) 140px 56px}
.bi-head{display:grid;grid-template-columns:110px minmax(0,1fr) 140px 56px;gap:5px;margin-top:14px;font-size:var(--fs-xs);color:var(--muted);font-weight:700;padding:0 2px}

/* 예산 — 색 규칙 그대로: 기지출 초록 · 지출예정 파랑 · 잔액 회색 · 초과 빨강 */
.budget-board{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:2px 11px 8px;display:grid;grid-auto-rows:max-content;gap:8px;align-content:start}
.bg-summary{border:1px solid var(--line);border-radius:12px;background:var(--sub);padding:10px 11px;display:grid;gap:8px}
.bg-total{display:flex;align-items:baseline;gap:8px}
.bt-k{font-size:var(--fs-xs);color:var(--muted);font-weight:700}
.bt-v{font-size:var(--fs-lg);font-weight:700}
.bg-actions{display:flex;gap:6px}
.bg-actions .btn{height:var(--ctl-h-sm);font-size:var(--fs-xs)}
.bg-title{font-size:var(--fs-xs);color:var(--muted)}
.bg-bar{display:flex;height:8px;border-radius:999px;background:#e6e8ea;overflow:hidden}
.bg-bar i{display:block;height:100%}
.bg-bar i.s{background:var(--done)}
.bg-bar i.p{background:var(--accent)}
.bg-bar.over i.p{background:var(--danger)}
.bg-figs{display:flex;gap:12px;white-space:nowrap;flex-wrap:wrap}
.fig{display:grid}
.fig em{font-style:normal;font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.fig b{font-size:var(--fs-sm);font-weight:700}
.fig.s b{color:var(--done)}
.fig.p b{color:var(--accent)}
.fig.r.neg b{color:var(--danger)}
.bg-list{display:grid;gap:7px}
.bg-row{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.bg-row.open{border-color:var(--line-strong)}
.bg-head{width:100%;text-align:left;border:0;background:transparent;padding:10px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.bg-head:hover{background:#fafbfc}
.bg-name{display:block;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg-code{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.bg-amount{font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.bg-mid{grid-column:1/-1}
.bg-head>.bg-figs{grid-column:1/-1}
.bg-body{display:none;padding:0 10px 10px;gap:6px;grid-template-columns:1fr}
.bg-row.open .bg-body{display:grid}
.bg-project{border:1px solid var(--line);border-radius:9px;background:var(--sub);overflow:hidden}
.bp-head{width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bp-head:hover{background:#f0f1f3}
.bp-name{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-figs{display:flex;gap:10px;font-size:var(--fs-xs);color:var(--muted);font-weight:500;white-space:nowrap;grid-column:1/-1}
.bp-total{font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.bp-body{display:none;padding:0 8px 8px;gap:5px;grid-template-columns:1fr}
.bg-project.open .bp-body{display:grid}
.bg-vendor{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px}
.bv-head{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-xs);font-weight:700;padding:3px 5px 5px}
.bv-total{font-variant-numeric:tabular-nums}
.bg-spend{width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:5px 6px;display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;font-size:var(--fs-xs)}
.bg-spend:hover{background:var(--sub)}
.bs-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bs-date{color:var(--muted)}
.bs-status{border-radius:999px;padding:2px 8px;font-weight:700}
.bs-status.spent{color:var(--done);background:var(--done-soft)}
.bs-status.planned{color:var(--accent);background:var(--accent-soft)}
.bs-amount{font-weight:700;min-width:84px;text-align:right}

/* 검색되는 선택 칸 — 기존 <select> 위에 씌운다. select 는 값의 주인으로 남아 있다. */
.cb{position:relative}
.cb-native{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.cb-input{width:100%;height:var(--ctl-h);border:1px solid #cdd1d5;border-radius:8px;background:#fff;padding:0 30px 0 11px;font-size:var(--fs-sm)}
.cb:after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;margin-top:-5px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.cb.open:after{transform:rotate(-135deg);margin-top:-2px}
.cb-list{position:absolute;z-index:80;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;max-height:236px;overflow:auto;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 32px rgba(19,20,22,.16)}
.cb-opt{padding:8px 10px;border-radius:7px;font-size:var(--fs-sm);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-opt.active{background:var(--accent-soft);color:var(--accent)}
.cb-opt[aria-selected="true"]{font-weight:700}
.cb-opt.create{margin-top:4px;border-top:1px solid var(--line);padding-top:9px;color:var(--accent);font-weight:700;border-radius:0 0 7px 7px}
.cb-opt.create.active{background:var(--accent-soft)}
.cb-empty{padding:9px 10px;font-size:var(--fs-xs);color:var(--muted)}

/* 좁은 화면(브라우저 미리보기) */
@media(max-width:1080px){
  .desk{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}
  .piece-cal{grid-row:auto;min-height:560px}
  .piece-mini,.piece-status{min-height:340px}
}
@media(max-width:620px){
  .log-compose{grid-template-columns:1fr}
  .attachment-item{grid-template-columns:20px minmax(0,1fr) auto}
  .attachment-item .tiny-link.danger{grid-column:3}
  .detail-modal{width:100%}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .template-layout{grid-template-columns:1fr}
  .template-list{max-height:180px;overflow:auto}
}

<!-- 창이 없는 앱. 세 조각이 각각 바탕화면에 상주하는 무장식 창이다(도우미 방식).
     브라우저·검사에서는 파라미터 없이 세 조각이 한 페이지에 함께 렌더된다. -->
<div class="desk" id="desk">

<!-- ① 달력 시트 — 배경화면에 심어진 월 달력. 빈 날짜 더블클릭 = 일정 추가(DesktopCal 관례). -->
<section class="piece piece-cal" id="pieceCal">
  <header class="sheet-head" data-tauri-drag-region>
    <span class="grip" data-tauri-drag-region aria-hidden="true"></span>
    <h1 class="month-title" id="monthTitle" data-tauri-drag-region></h1>
    <div class="cal-nav" id="calNav"><button class="pbtn icon" id="prevMonth" aria-label="이전 달"><svg class="ico" aria-hidden="true"><use href="#i-chevron-left"/></svg></button><button class="pbtn icon" id="nextMonth" aria-label="다음 달"><svg class="ico" aria-hidden="true"><use href="#i-chevron-right"/></svg></button><button class="pbtn" id="todayBtn">오늘</button></div>
    <span class="hint" id="calHint" data-tauri-drag-region></span>
    <button class="pbtn primary" id="addScheduleBtn"><svg class="ico" aria-hidden="true"><use href="#i-calendar-plus"/></svg><span class="label" data-t="addEvent"></span></button>
  </header>
  <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="calendar-scroll" id="calendarScroll"><div class="month-grid" id="monthGrid"></div></div>
</section>

<!-- ② 미니 대시보드 — 일정순/업체별 토글 하나. 지남·오늘·예정을 따로 나누지 않는다(색으로 구분). -->
<aside class="piece piece-mini" id="pieceMini">
  <header class="mini-head" data-tauri-drag-region>
    <span class="grip" data-tauri-drag-region aria-hidden="true"></span>
    <div class="tabs seg" role="tablist" aria-label="미니 대시보드 보기"><button class="tab" role="tab" data-board="due" data-t="viewDue"></button><button class="tab" role="tab" data-board="vendor" data-t="viewVendor"></button></div>
    <span class="overdue-pill zero" id="overduePill" title="기한이 지난 미완료 건"></span>
    <div class="horizon"><select id="horizonSelect" aria-label="D-day 기준"><option value="3">D-3</option><option value="5">D-5</option><option value="7">D-7</option><option value="14">D-14</option><option value="30">D-30</option><option value="all">무제한</option><option value="custom">직접설정</option></select><input id="horizonCustom" type="number" min="1" max="3650" class="hidden" aria-label="직접 D-day 일수"></div>
  </header>
  <div class="omni-box" id="omniBox">
    <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="omni" type="text" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="omniList" aria-autocomplete="list">
    <button id="omniAdd" aria-label="일정 추가" title="일정 추가">+</button>
    <div class="omni-list hidden" id="omniList" role="listbox"></div>
  </div>
  <div class="due-list" id="dueList"></div>
  <div class="vendor-board hidden" id="vendorBoard"></div>
  <footer class="mini-tools">
    <button class="tool" id="addWorkBtn"><svg class="ico" aria-hidden="true"><use href="#i-folder-plus"/></svg><span data-t="addProject"></span></button>
    <button class="tool" id="templateBtn"><svg class="ico" aria-hidden="true"><use href="#i-layout-template"/></svg>템플릿</button>
    <button class="tool" id="settingsBtn"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg>설정</button>
  </footer>
</aside>

<!-- ③ 현황 — 행사·예산. 줄을 누르면 그 자리에서 펼쳐진다. -->
<aside class="piece piece-status" id="pieceStatus">
  <header class="mini-head" data-tauri-drag-region><span class="grip" data-tauri-drag-region aria-hidden="true"></span><span class="piece-title" data-tauri-drag-region>현황</span><span class="hint" id="statusHint" data-tauri-drag-region></span></header>
  <div class="status-scroll">
    <section class="st-sec" id="stGroupSec">
      <button class="st-head" data-board="group" aria-expanded="false"><span class="st-title" data-t="viewGroup"></span><span class="st-sum" id="stGroupSum"></span><span class="st-caret" aria-hidden="true"></span></button><button class="st-mk hidden" id="stGroupMake">＋ 만들기</button>
      <div class="st-face" id="stGroupFace"></div>
      <div class="vendor-board hidden" id="groupBoard"></div>
    </section>
    <section class="st-sec" id="stBudgetSec">
      <button class="st-head" data-board="budget" aria-expanded="false"><span class="st-title" data-t="viewBudget"></span><span class="st-sum" id="stBudgetSum"></span><span class="st-caret" aria-hidden="true"></span></button><button class="st-mk hidden" id="stBudgetMake">＋ 합본예산서</button>
      <div class="st-face" id="stBudgetFace"></div>
      <div class="budget-board hidden" id="budgetBoard"></div>
    </section>
  </div>
</aside>

</div>

<div class="modal-bg" id="scheduleModal"><section class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="scheduleTitle"><div class="modal-head"><h2 id="scheduleTitle" data-t="eventModalTitle"></h2><button class="close" data-close="scheduleModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body"><div class="form-grid">

</div></div><div class="modal-foot"><button class="btn" data-close="scheduleModal">취소</button><button class="btn primary" id="saveScheduleBtn" data-t="saveEvent"></button></div></section></div>

<div class="modal-bg" id="workModal"><section class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="workTitle"><div class="modal-head"><h2 id="workTitle" data-t="projectModalTitle"></h2><button class="close" data-close="workModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body"><div class="form-grid">
  <div class="field"><label for="wVendor" data-t="fVendor"></label><select id="wVendor"></select></div><div class="field"><label for="wGroup" data-t="fGroup"></label><select id="wGroup"></select></div>

<div class="modal-bg" id="templateModal"><section class="modal wide" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="templateTitle"><div class="modal-head"><h2 id="templateTitle">템플릿 관리</h2><button class="close" data-close="templateModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body"><div class="tabs"><button class="tab active" data-template-tab="vendor" data-t="fVendorTemplate"></button><button class="tab" data-template-tab="work" data-t="fWorkTemplate"></button><button class="tab" data-template-tab="terms">용어·항목</button></div><div id="vendorTemplatePane"></div><div id="workTemplatePane" class="hidden"></div><div id="termsPane" class="hidden"></div></div><div class="modal-foot"><button class="btn" data-close="templateModal">닫기</button></div></section></div>

<script>
/**
 * 의존성 없는 최소 ZIP 읽기/쓰기.
 *
 * 백업에 첨부파일 실물이 들어가야 하므로(발주서 §16.3) 압축 컨테이너가 필요한데,
 * 이 프로젝트는 의존성을 최소로 유지한다(§18). WebView2/Chromium 에 있는
 * CompressionStream('deflate-raw') 로 표준 ZIP 을 직접 만든다.
 *
 * 쓰기: deflate 가 이득일 때만 압축하고 아니면 저장(method 0).
 * 읽기: method 0 과 8 을 모두 받는다 — 사용자가 탐색기에서 다시 압축한 파일도 열려야 한다.
 */
(function () {
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[i] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  async function through(bytes, Stream, kind) {
    const s = new Stream(kind);
    const w = s.writable.getWriter();
    w.write(bytes);
    w.close();
    const parts = [];
    const r = s.readable.getReader();
    for (;;) {
      const { done, value } = await r.read();
      if (done) break;
      parts.push(value);
    }
    let len = 0;
    for (const p of parts) len += p.length;
    const out = new Uint8Array(len);
    let at = 0;
    for (const p of parts) { out.set(p, at); at += p.length; }
    return out;
  }
  const deflateRaw = (b) => through(b, CompressionStream, 'deflate-raw');
  const inflateRaw = (b) => through(b, DecompressionStream, 'deflate-raw');

  // ZIP 은 1980 기준 DOS 시각을 쓴다.
  function dosTime(d) {
    return { time: ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xffff,
             date: (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xffff };
  }

  /**
   * @param {{name:string, data:Uint8Array}[]} entries
   * @returns {Promise<Uint8Array>}
   */
  async function create(entries, when = new Date()) {
    const { time, date } = dosTime(when);
    const parts = [];
    const central = [];
    let offset = 0;

    for (const e of entries) {
      const name = enc.encode(e.name);
      const raw = e.data instanceof Uint8Array ? e.data : new Uint8Array(e.data);
      const crc = crc32(raw);
      let body = raw, method = 0;
      if (raw.length > 64) {
        const packed = await deflateRaw(raw);
        if (packed.length < raw.length) { body = packed; method = 8; }
      }

      const lfh = new Uint8Array(30);
      const lv = new DataView(lfh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);   // 파일명 UTF-8
      lv.setUint16(8, method, true);
      lv.setUint16(10, time, true);
      lv.setUint16(12, date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, body.length, true);
      lv.setUint32(22, raw.length, true);
      lv.setUint16(26, name.length, true);
      parts.push(lfh, name, body);

      const cdh = new Uint8Array(46);
      const cv = new DataView(cdh.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, method, true);
      cv.setUint16(12, time, true);
      cv.setUint16(14, date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, body.length, true);
      cv.setUint32(24, raw.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);
      central.push(cdh, name);

      offset += lfh.length + name.length + body.length;
    }

    let cdSize = 0;
    for (const c of central) cdSize += c.length;

    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    let total = offset + cdSize + eocd.length;
    const out = new Uint8Array(total);
    let at = 0;
    for (const p of [...parts, ...central, eocd]) { out.set(p, at); at += p.length; }
    return out;
  }

  /**
   * @param {Uint8Array} bytes
   * @returns {Promise<Map<string, Uint8Array>>}
   */
  async function read(bytes) {
    const v = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    // EOCD 는 끝에서 뒤로 찾는다(주석이 붙어 있을 수 있다).
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('ZIP 형식이 아닙니다.');

    const count = v.getUint16(eocd + 10, true);
    let p = v.getUint32(eocd + 16, true);
    const out = new Map();

    for (let n = 0; n < count; n++) {
      if (v.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP 중앙 디렉터리가 손상됐습니다.');
      const method = v.getUint16(p + 10, true);
      const compSize = v.getUint32(p + 20, true);
      const rawSize = v.getUint32(p + 24, true);
      const nameLen = v.getUint16(p + 28, true);
      const extraLen = v.getUint16(p + 30, true);
      const commentLen = v.getUint16(p + 32, true);
      const local = v.getUint32(p + 42, true);
      const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;

      if (v.getUint32(local, true) !== 0x04034b50) throw new Error(`ZIP 항목이 손상됐습니다: ${name}`);
      const lNameLen = v.getUint16(local + 26, true);
      const lExtraLen = v.getUint16(local + 28, true);
      const start = local + 30 + lNameLen + lExtraLen;
      const body = bytes.subarray(start, start + compSize);

      if (name.endsWith('/')) continue; // 디렉터리 항목
      if (method === 0) out.set(name, body.slice());
      else if (method === 8) out.set(name, await inflateRaw(body));
      else throw new Error(`지원하지 않는 압축 방식(${method}): ${name}`);

      const got = out.get(name);
      if (got && got.length !== rawSize) throw new Error(`ZIP 항목 크기가 맞지 않습니다: ${name}`);
    }
    return out;
  }

  const supported = () => typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';

  window.WorkZip = { create, read, crc32, supported };
})();

</script><script>
(function(){
  // ── 검색되는 선택 칸 ──────────────────────────────────────────────────────
  // 업체가 나오는 곳 세 군데가 전부 맨 <select> 였다. 업체가 50곳 넘어가면
  // 드롭다운을 눈으로 훑어야 하고, 목록에 없으면 다른 화면으로 나가서 만들고 돌아와야 했다.
  //
  // 기존 <select> 를 없애지 않고 그 위에 씌운다. select 가 계속 값의 주인이라
  // 저장 코드와 검사는 하나도 고치지 않아도 된다(점진적 향상).
  //
  // 역할·키보드는 W3C APG 콤보박스 패턴을 따른다:
  // role=combobox / aria-expanded / aria-controls / aria-activedescendant,
  // ↑↓ 이동 · Enter 선택 · Esc 닫기 · Tab 로 빠져나감.
  let seq=0;
  const norm=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,'');
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const registry=new Map();   // select -> controller

  function enhance(select,opts={}){
    if(!select||registry.has(select))return registry.get(select);
    const id=`cb${++seq}`;
    const wrap=document.createElement('div');
    wrap.className='cb';
    select.parentNode.insertBefore(wrap,select);
    wrap.appendChild(select);
    select.classList.add('cb-native');
    select.setAttribute('tabindex','-1');
    select.setAttribute('aria-hidden','true');

    const input=document.createElement('input');
    input.type='text';input.className='cb-input';input.autocomplete='off';
    input.setAttribute('role','combobox');
    input.setAttribute('aria-expanded','false');
    input.setAttribute('aria-autocomplete','list');
    input.setAttribute('aria-controls',`${id}-list`);
    if(opts.placeholder)input.placeholder=opts.placeholder;
    const lab=select.getAttribute('aria-label')||document.querySelector(`label[for="${select.id}"]`)?.textContent;
    if(lab)input.setAttribute('aria-label',lab.trim());
    if(select.id)input.id=`${select.id}Input`;

    const list=document.createElement('ul');
    list.className='cb-list';list.id=`${id}-list`;list.setAttribute('role','listbox');list.hidden=true;
    wrap.appendChild(input);wrap.appendChild(list);

    let rows=[],active=-1,open=false;

    const options=()=>[...select.options].map(o=>({value:o.value,label:o.textContent}));
    const selected=()=>options().find(o=>o.value===select.value)||null;
    const showText=()=>{input.value=selected()?.label||''};

    function build(q){
      const all=options();
      const nq=norm(q);
      const hits=nq?all.filter(o=>norm(o.label).includes(nq)):all;
      rows=hits.map(o=>({type:'item',...o}));
      // 목록에 없을 때만 만들기 줄을 낸다. 같은 이름이 있으면 내지 않는다.
      const dup=all.some(o=>norm(o.label)===nq);
      if(opts.allowCreate&&nq&&!dup)rows.push({type:'create',value:'__create__',label:(opts.createLabel||(n=>`‘${n}’ 새로 만들기`))(q.trim())});
      list.innerHTML=rows.map((r,i)=>`<li class="cb-opt${r.type==='create'?' create':''}" role="option" id="${id}-o${i}" aria-selected="${r.type==='item'&&r.value===select.value}">${esc(r.label)}</li>`).join('')
        ||`<li class="cb-empty" role="option" aria-disabled="true">찾는 것이 없습니다</li>`;
      setActive(rows.length?0:-1);
    }
    function setActive(i){
      active=i;
      [...list.querySelectorAll('.cb-opt')].forEach((el,k)=>el.classList.toggle('active',k===i));
      if(i>=0){input.setAttribute('aria-activedescendant',`${id}-o${i}`);list.querySelectorAll('.cb-opt')[i]?.scrollIntoView({block:'nearest'})}
      else input.removeAttribute('aria-activedescendant');
    }
    function openList(q){open=true;list.hidden=false;input.setAttribute('aria-expanded','true');wrap.classList.add('open');build(q??'')}
    function closeList(){open=false;list.hidden=true;input.setAttribute('aria-expanded','false');wrap.classList.remove('open');setActive(-1)}
    function commit(value){
      select.value=value;
      select.dispatchEvent(new Event('change',{bubbles:true}));
      showText();closeList();
    }
    async function pick(i){
      const r=rows[i];if(!r)return;
      if(r.type==='create'){
        const name=input.value.trim();
        if(!name||!opts.onCreate)return;
        const newValue=await opts.onCreate(name);
        if(!newValue){closeList();showText();return}
        if(![...select.options].some(o=>o.value===newValue)){
          const o=document.createElement('option');o.value=newValue;o.textContent=name;select.appendChild(o);
        }
        commit(newValue);return;
      }
      commit(r.value);
    }

    input.addEventListener('focus',()=>openList(''));
    input.addEventListener('click',()=>{if(!open)openList('')});
    input.addEventListener('input',()=>openList(input.value));
    input.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){e.preventDefault();if(!open)openList('');else setActive(Math.min(active+1,rows.length-1));return}
      if(e.key==='ArrowUp'){e.preventDefault();if(open)setActive(Math.max(active-1,0));return}
      if(e.key==='Enter'){if(open&&active>=0){e.preventDefault();pick(active)}return}
      if(e.key==='Escape'){if(open){e.stopPropagation();closeList();showText()}return}
      if(e.key==='Tab')closeList();
    });
    // mousedown 으로 잡아야 blur 보다 먼저 처리된다.
    list.addEventListener('mousedown',e=>{
      const li=e.target.closest('.cb-opt');if(!li)return;
      e.preventDefault();pick([...list.querySelectorAll('.cb-opt')].indexOf(li));
    });
    input.addEventListener('blur',()=>{setTimeout(()=>{if(!wrap.contains(document.activeElement)){closeList();showText()}},0)});
    // 원래 select 가 값의 주인이다. 값이 바깥에서 바뀌면(프로그램·키보드·보조기기)
    // 보이는 글자도 따라가야 한다 — 안 그러면 화면과 실제 값이 조용히 갈라진다.
    select.addEventListener('change',()=>{if(document.activeElement!==input)showText()});

    // app.js 가 fillSelects() 로 <option> 을 통째로 다시 그린다. 그때 표시 글자도 따라와야 한다.
    new MutationObserver(()=>{if(!open)showText()}).observe(select,{childList:true});

    const ctl={select,input,sync:showText,focus:()=>input.focus()};
    registry.set(select,ctl);
    showText();
    return ctl;
  }

  /** 프로그램이 select.value 를 직접 바꾼 뒤 표시 글자를 맞춘다(모달을 열 때 한 번). */
  function syncAll(root=document){
    registry.forEach((ctl,select)=>{if(root===document||root.contains(select))ctl.sync()});
  }
  window.WorkCombo={enhance,syncAll};
})();

</script><script>
(function(){
  // 저장 키는 v5 그대로 둔다. 키를 올리면 기존 사용자의 v5 데이터가 통째로 고아가 된다.
  // 스키마 버전은 상태 안의 version 필드와 migrate() 가 관리한다.
  const KEY='work-calendar-state-v5';
  const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+Number(n||0));return iso(d)};
  const diffDays=(s,base=todayISO())=>Math.round((parse(s)-parse(base))/86400000);
  const pretty=s=>{if(!s)return'';const d=parse(s);return `${d.getMonth()+1}.${d.getDate()}.`};

  // 한글 음절은 0xAC00 부터 종성 28개 주기를 가지므로 (코드-0xAC00)%28 이 0 이면 받침이 없다.
  // 근사가 아니라 규칙이다.
  function finalJamo(w){
    const s=String(w??'');if(!s)return -1;
    const c=s.charCodeAt(s.length-1);
    if(c<0xac00||c>0xd7a3)return -1;      // 한글 음절이 아니면 판정하지 않는다
    return (c-0xac00)%28;                  // 0 = 받침 없음, 8 = ㄹ
  }
  /** josa('업체',['을','를']) -> '업체를' · pair[0]=받침 있을 때, pair[1]=없을 때 */
  function josa(word,pair){
    const w=String(word??''),j=finalJamo(w);
    if(pair[0]==='으로')return w+(j<0||j===0||j===8?'로':'으로');   // ㄹ 받침은 '로'
    if(j<0)return w+pair[1];                                          // 한글이 아니면 받침 없는 쪽
    return w+(j===0?pair[1]:pair[0]);
  }

  // 저장된 상태를 현재 스키마로 올린다. 버전을 무조건 덮어쓰지 않고 단계별로 통과시켜야
  // 다음 스키마 변경 때 기존 데이터를 안전하게 이관할 수 있다.
  function migrate(s){
    let v=Number(s.version||0);
    if(v<6){
      // v5 -> v6: 필드 구조 변경 없음. pendingSelection(창 간 딥링크)만 새로 쓰인다.
      if(!('pendingSelection' in s))s.pendingSelection=null;

        (Array.isArray(s.vendorTemplates)?s.vendorTemplates:[]).forEach(x=>{
          x.values=x.values||{};
          const carry={'vf-person':x.person,'vf-contact':x.contact,'vf-memo':x.memo};
          for(const [k,val] of Object.entries(carry))if(val!==undefined&&x.values[k]===undefined)x.values[k]=val;
        });
      }
      v=7;
    }
    if(v<8){
      // v7 -> v8: 예산과 지출이 생긴다. 기존 필드는 하나도 건드리지 않는다.
      if(!s.budget||typeof s.budget!=='object')s.budget={title:'',year:null,items:[]};
      if(!Array.isArray(s.budget.items))s.budget.items=[];
      if(!Array.isArray(s.spends))s.spends=[];
      v=8;
    }
    if(v<9){
      // v8 -> v9: 행사(그룹)가 생긴다.
      // project.vendorId 가 업체 한 곳이라 '한 행사에 업체 10곳'을 담을 수 없었다.
      // 업무는 그대로 '업체 × 행사' 참여 건으로 두고, 그 위에 행사를 얹는다.
      // 기존 필드는 하나도 건드리지 않는다 — 행사를 안 쓰면 v8 과 똑같이 돈다.
      if(!Array.isArray(s.groups))s.groups=[];
      (Array.isArray(s.projects)?s.projects:[]).forEach(p=>{if(!('groupId' in p))p.groupId=null});
      v=9;
    }
    s.version=v;
    return s;
  }

  function normalizeState(x){
    const s=migrate(x&&typeof x==='object'?x:clone(seed));
    s.settings=s.settings||clone(seed.settings);
    s.pendingSelection=s.pendingSelection||null;
    s.terms={...defaultTerms(),...(s.terms||{})};
    s.vendorFields=Array.isArray(s.vendorFields)&&s.vendorFields.length?s.vendorFields:defaultVendorFields();
    s.vendorTemplates=Array.isArray(s.vendorTemplates)?s.vendorTemplates:[];
    s.vendorTemplates.forEach(x=>{x.values=x.values&&typeof x.values==='object'?x.values:{}});
    s.workTemplates=Array.isArray(s.workTemplates)?s.workTemplates:[];
    s.projects=Array.isArray(s.projects)?s.projects:[];
    s.manualEvents=Array.isArray(s.manualEvents)?s.manualEvents:[];
    s.budget={title:'',year:null,...(s.budget||{})};
    s.budget.items=Array.isArray(s.budget.items)?s.budget.items:[];
    s.spends=Array.isArray(s.spends)?s.spends:[];
    s.groups=Array.isArray(s.groups)?s.groups:[];

  // ── 첨부 저장 ────────────────────────────────────────────────────────────
  // 데스크톱은 앱 전용 폴더에 실제 파일로, 웹은 IndexedDB Blob 으로 저장한다(§16.2).
  //
  // 권한 표면을 좁히려고 "사용자가 고른 임의 경로에 쓰기"를 아예 만들지 않았다.
  // 백업 내보내기도 앱 폴더에 쓴 뒤 그 폴더를 탐색기로 열어 주는 방식이라,
  // 앱은 자기 데이터 디렉터리 밖을 건드릴 수 없다(§26).
  const ATTACH_DIR='attachments',BACKUP_DIR='backups',BACKUP_KEEP=7;
  const SAFE_ID=/^[A-Za-z0-9_-]+$/;
  const fsApi=()=>window.__TAURI__?.fs;
  const pathApi=()=>window.__TAURI__?.path;
  const openerApi=()=>window.__TAURI__?.opener;
  const nativeFiles=()=>!!(window.__TAURI__?.core&&fsApi()?.writeFile);
  const appDir=()=>fsApi().BaseDirectory.AppLocalData;
  const extOf=n=>{const m=/\.([A-Za-z0-9]{1,12})$/.exec(String(n||''));return m?m[1].toLowerCase():'bin'};
  function attachPath(entityId,attId,ext){
    // 물리 파일명에 사용자 입력이 절대 들어가지 않게 한다. id 는 uid() 산출물이지만 한 번 더 막는다.
    if(!SAFE_ID.test(String(entityId))||!SAFE_ID.test(String(attId)))throw new Error('첨부 경로에 쓸 수 없는 식별자입니다.');
    return `${ATTACH_DIR}/${entityId}/${attId}.${SAFE_ID.test(ext)?ext:'bin'}`;
  }
  const ATTACH_DB='work-calendar-attachments-v1',ATTACH_STORE='files';
  function openAttachmentDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}const req=indexedDB.open(ATTACH_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(ATTACH_STORE))db.createObjectStore(ATTACH_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

  async function idbDelete(id){try{const db=await openAttachmentDB();await new Promise((resolve,reject)=>{const tx=db.transaction(ATTACH_STORE,'readwrite');tx.objectStore(ATTACH_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('attachment delete failed',e)}}

  // 발주서 §15 의 AttachmentMeta 형태로 돌려준다. backend 로 어디에 실물이 있는지 구분한다.
  async function storeAttachmentBytes(entityId,meta,bytes){
    if(nativeFiles()){
      const rel=attachPath(entityId,meta.id,extOf(meta.name)),fs=fsApi();
      await fs.mkdir(`${ATTACH_DIR}/${entityId}`,{baseDir:appDir(),recursive:true});
      await fs.writeFile(rel,bytes,{baseDir:appDir()});
      return {...meta,backend:'tauri-fs',relativePath:rel};
    }
    await idbPut({...meta,blob:new Blob([bytes],{type:meta.type||'application/octet-stream'})});
    return {...meta,backend:'indexeddb',relativePath:undefined};
  }
  async function putAttachment(file,entityId){
    const meta={id:uid('att'),name:file.name,type:file.type||'application/octet-stream',size:file.size,addedAt:new Date().toISOString()};
    return storeAttachmentBytes(entityId,meta,new Uint8Array(await file.arrayBuffer()));
  }
  // 실물이 없으면 ATTACHMENT_MISSING 을 던진다. 호출부는 파괴적이지 않게 안내만 한다(인수조건 D).
  async function readAttachment(meta){
    if(meta?.backend==='tauri-fs'&&meta.relativePath){
      if(!nativeFiles())throw new Error('ATTACHMENT_MISSING');
      const fs=fsApi();
      if(!await fs.exists(meta.relativePath,{baseDir:appDir()}))throw new Error('ATTACHMENT_MISSING');
      return {bytes:await fs.readFile(meta.relativePath,{baseDir:appDir()}),name:meta.name,type:meta.type};
    }
    const row=await idbGet(meta.id);
    if(!row?.blob)throw new Error('ATTACHMENT_MISSING');
    return {bytes:new Uint8Array(await row.blob.arrayBuffer()),name:row.name||meta.name,type:row.type||meta.type};
  }
  async function deleteAttachment(meta){
    if(!meta)return;
    if(meta.backend==='tauri-fs'&&meta.relativePath&&nativeFiles()){
      try{await fsApi().remove(meta.relativePath,{baseDir:appDir()})}catch(e){console.warn('첨부 파일 삭제 실패',e)}
      return;
    }
    await idbDelete(meta.id);
  }
  function attachmentsOf(entities){return entities.flatMap(e=>Array.isArray(e?.attachments)?e.attachments:[])}
  async function purgeAttachments(metas){for(const m of metas)await deleteAttachment(m)}
  // 데스크톱에서 첨부를 OS 기본 프로그램으로 연다. 웹은 호출부가 Blob 다운로드로 처리한다.
  async function revealAttachment(meta){
    if(!(meta?.backend==='tauri-fs'&&meta.relativePath&&openerApi()&&pathApi()))return false;
    const base=await pathApi().appLocalDataDir();
    await openerApi().openPath(await pathApi().join(base,meta.relativePath));
    return true;
  }
  function formatBytes(n){n=Number(n||0);if(n<1024)return`${n} B`;if(n<1048576)return`${(n/1024).toFixed(n<10240?1:0)} KB`;return`${(n/1048576).toFixed(n<10485760?1:0)} MB`}
  let store=null;let memoryState=normalizeState(clone(seed));
  const isTauri=()=>!!(window.__TAURI__?.core);
  async function initStorage(){
    if(isTauri() && window.__TAURI__?.store?.load){
      try{
        store=await window.__TAURI__.store.load('work-calendar.json',{autoSave:150});
        const value=await store.get('state');
        if(value) return normalizeState(value);
        await store.set('state',clone(seed));await store.save();return normalizeState(clone(seed));
      }catch(e){console.warn('Tauri store fallback',e)}
    }
    try{const raw=localStorage.getItem(KEY);if(raw)return normalizeState(JSON.parse(raw))}catch(e){}
    try{localStorage.setItem(KEY,JSON.stringify(seed));}catch(e){} memoryState=normalizeState(clone(seed));return clone(memoryState);
  }
  // Tauri Store 의 onKeyChange 는 "내가 방금 쓴 값"에도 발화한다. 그대로 두면 저장할 때마다
  // 상태 객체가 통째로 교체되어, 템플릿 편집기처럼 배열을 직접 참조하는 화면에서 입력이 유실된다.
  // _rev 로 자기가 쓴 변경인지 구분해 걸러낸다.
  let lastRev=0;
  async function saveState(state){state=normalizeState(state);
    state._rev=lastRev=(Number(state._rev)||0)+1;
    if(store){await store.set('state',state);await store.save();}
    else {try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){memoryState=clone(state)}}
    try{new BroadcastChannel(KEY).postMessage({type:'state'});}catch(e){}
  }
  async function watchState(cb){
    // 콜백에는 항상 정규화된 상태를 넘긴다. 이전에는 store 경로에서 원본을 그대로 넘겨
    // 정규화되지 않은 객체가 화면으로 들어갔다.
    const relay=v=>{if(!v)return;const s=normalizeState(v);if(s._rev&&s._rev===lastRev)return;cb(s)};
    if(store?.onKeyChange){try{return await store.onKeyChange('state',relay);}catch(e){}}
    window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{relay(JSON.parse(e.newValue))}catch(_){}}});
    try{const bc=new BroadcastChannel(KEY);bc.onmessage=async()=>{relay(await readState())};}catch(e){}
  }
  async function readState(){if(store){return normalizeState((await store.get('state'))||clone(seed))}try{return normalizeState(JSON.parse(localStorage.getItem(KEY)||'null')||clone(memoryState))}catch(e){return clone(memoryState)}}
  function vendor(state,id){return state.vendorTemplates.find(v=>v.id===id)}
  function project(state,id){return state.projects.find(p=>p.id===id)}
  function group(state,id){return (state.groups||[]).find(g=>g.id===id)}
  /** 그 행사의 참여 건(업무)들. 업무 하나가 '업체 × 행사' 한 칸이다. */
  const projectsOfGroup=(state,gid)=>state.projects.filter(p=>p.groupId===gid);
  function currentStep(p){return p?.steps?.find(s=>!s.completed)||null}
  /** 아직 날짜가 없는 뒤 단계의 '예상 마감일'을 템플릿 offset 을 누적해 계산한다.
   *
   *  지금까지 업무를 등록하면 첫 단계에만 날짜가 붙었고, 완료할 때마다 바로 다음 한 건에만
   *  날짜가 생겼다. 템플릿은 단계마다 +2일 +3일 +20일을 이미 갖고 있는데 첫 단계 말고는
   *  쓰지 않았다 — 그래서 업무당 미래 마감이 언제나 정확히 1건이었고, 3주 뒤 계약 마감이
   *  다가오는지 알 방법이 없었다. 이게 없으면 이 앱은 '업체 이름이 붙는 달력'일 뿐이다.
   *
   *  계산만 하고 저장하지 않는다. 상태를 건드리지 않으니 마이그레이션도, 되돌리기도,
   *  '사용자가 넣은 날짜인지 자동 계산인지' 구분 문제도 생기지 않는다. 실제 완료일이
   *  쌓이면 그 뒤 예상일이 저절로 당겨지거나 밀린다. */
  function projectedDates(p){
    const out=new Map();
    if(!p||!Array.isArray(p.steps))return out;
    // 기준점: 날짜가 있는 마지막 단계(완료됐으면 실제 완료일). 없으면 계산하지 않는다.
    let base=null;
    for(const s of p.steps){
      if(s.completed&&s.completedAt)base=s.completedAt;
      else if(s.dueDate)base=s.dueDate;
      else if(base){base=addDays(base,Math.max(0,Number(s.offset||0))||1);out.set(s.id,base)}
    }
    return out;
  }
  function eventRecords(state){
    const rows=[];
    // 절차 단계에는 기간을 주지 않는다. 절차는 본질적으로 마감일이고, 기간을 주면 의미가 흐려진다.
    state.projects.forEach(p=>{
      const proj=projectedDates(p),cur=currentStep(p);
      p.steps.forEach(s=>{
        const guess=proj.get(s.id);
        if(!s.dueDate&&!guess)return;
        // 예상 = 계산으로 깐 날짜이고 지금 진행할 차례도 아니다. 확정 건과 형태로 구분하고,
        // 급한 일 목록·지남 카운트에는 넣지 않는다 — 추측으로 경보를 울리면 안 된다.
        const planned=!s.dueDate&&!!guess&&s.id!==cur?.id;
        rows.push({kind:'step',id:s.id,date:s.dueDate||guess,endDate:null,name:s.name,
          completed:!!s.completed,vendorId:p.vendorId,projectId:p.id,
          memo:s.memo||p.memo||'',step:s,planned});
      });
    });

  }
