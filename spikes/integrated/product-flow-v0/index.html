<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkDashboard — Integrated UX Prototype v0</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-stage="idle" data-density="compact" data-layout-edit="0" data-cal-view="month">

    <g id="i-add"><path d="M9 3.5v11M3.5 9h11"/></g>
    <g id="i-grid"><rect x="2.5" y="2.5" width="13" height="13" rx="2"/><path d="M2.5 7h13M2.5 11.5h13M7 2.5v13"/></g>
    <g id="i-pin"><path d="M9 11v4"/><path d="M5.5 4.5h7l-1 4 2 2.5H4.5l2-2.5-1-4z"/></g>

    <g id="i-clock"><circle cx="9" cy="9" r="6.3"/><path d="M9 5.4V9l2.6 1.6"/></g>
    <g id="i-lens"><circle cx="8" cy="8" r="5"/><path d="M11.8 11.8L15.5 15.5"/></g>

<!-- 1. Desktop -->
<div id="desktop">
  <div class="deskwin" id="win1"></div>
  <div class="deskwin" id="win2"></div>
  <div class="taskbar" id="taskbar"></div>
</div>

<div id="scrim" hidden></div>

<!-- 2. Ambient -->
<section id="ambient" data-mode="rest" aria-label="Ambient"></section>

<!-- 12/13. D-day -->
<section id="dday" data-mode="rest" aria-label="D-day" hidden></section>

<!-- 3. Quick -->
<section id="quick" aria-label="Quick" hidden></section>

<!-- 4/5/6. Calendar Sheet -->
<section id="sheet" aria-label="Calendar Sheet" hidden></section>

<!-- 7/8/9. Object Lens -->
<div id="lensLayer"></div>

<!-- 10. Focus Surface -->
<section id="focus" aria-label="Focus Surface" hidden></section>

<!-- 11. Quick Add -->
<div id="quickAdd" hidden></div>

<!-- 14. Layout Edit -->
<div id="editbar" hidden></div>

<p class="sr" id="live" aria-live="polite"></p>

<script src="fixtures.js"></script>
<script src="app.js"></script>
</body>
</html>
