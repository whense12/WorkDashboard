<!doctype html><html lang="ko" class="helper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D-day 도우미</title><link rel="stylesheet" href="styles.css"></head><body class="helper-body"><main class="helper-shell" data-tauri-drag-region><header class="helper-grip" data-tauri-drag-region><span class="helper-handle" data-tauri-drag-region aria-hidden="true"></span><strong id="helperTitle" data-tauri-drag-region></strong><span class="helper-chip" id="helperHorizon" data-tauri-drag-region></span><button class="helper-icon add" id="helperQuick" title="빠른 일정 추가" aria-label="빠른 일정 추가" aria-expanded="false">+</button><button class="helper-icon" id="helperHide" title="치우기" aria-label="도우미 치우기">×</button></header><form class="helper-quick" id="helperQuickForm" hidden><input class="q-name" id="qName" type="text" autocomplete="off" maxlength="60"><div class="q-row"><select class="q-vendor" id="qVendor"></select><input class="q-date" id="qDate" type="date"></div><div class="q-row q-actions"><span class="q-msg" id="qMsg" role="status"></span><button class="link" id="qCancel" type="button">취소</button><button class="q-save" type="submit">추가</button></div></form><section class="helper-list" id="helperList" data-tauri-drag-region></section><footer class="helper-footer" data-tauri-drag-region><span id="helperUpdated" data-tauri-drag-region></span><button class="link" id="helperOpenMain">대시보드 열기</button></footer></main><script src="core.js"></script><script src="helper.js"></script></body></html>
