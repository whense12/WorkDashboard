    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:503"
    quote: "If a vendor is referenced by existing work/events, destructive deletion must be prevented or converted to an explicit migration/archive operation."
    status_reason: "\"must be prevented\" — binding. The remedy is left open between two alternatives (\"prevented or converted to an explicit migration/archive operation\"), so the obligation is APPROVED while the choice of mechanism is undecided by the contract."

