    quote: "type WorkTemplateStep = {\n  id?: string;          // optional at template level\n  name: string;\n  offset: number;\n};"
    status_reason: "Inside §15 \"(v6 suggested)\"; the inline comment \"optional at template level\" describes the suggested shape, not an obligation."

  - id: DAT-07
    title: "WorkTemplate type shape"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:680-684"
    quote: "type WorkTemplate = {\n  id: string;\n  name: string;\n  steps: WorkTemplateStep[];\n};"
