  - id: PRC-79
    title: "Phase 6 — Windows build and regression"
    status: UNKNOWN
    category: process
    source: "CODEX_IMPLEMENTATION_BRIEF.md:1242-1247"
    quote: "## Phase 6 — Windows build and regression\n\n- current official Tauri Windows pipeline,\n- NSIS artifact,\n- screenshots,\n- final test report."
    status_reason: "Ordered-phase content under the binding \"Use this order:\"; bullets are unhedged here even though §23.4's pipeline guidance is only \"Prefer\"red (line 1120) — see internal_conflicts. AGENTS.md:70 and \"Required validation\" item 4 back the NSIS/Windows part."
    verify_status_corrected_from: "APPROVED"
    verify_status_reason: "PRC-79 marks the whole Phase 6 block APPROVED, including its first bullet \"- current official Tauri Windows pipeline,\" (line 1244). The same subject is stated at a strictly weaker strength at line 1120: \"Prefer the current official Tauri GitHub pipeline guidance / `tauri-action` if appropriate for the repo.\" — which the extractor itself correctly graded PROVISIONAL (PRC-33) and listed as internal conflict #4. Under the stated rules, a contract that is \"internally inconsistent\" yields UNKNOWN; APPROVED here silently resolves the conflict in favour of the harder reading, which is exactly the resolution the instructions forbid. Correct handling: split the Phase 6 bullets and mark the pipeline bullet UNKNOWN (or PROVISIONAL, inheriting line 1120's hedge), leaving \"- NSIS artifact,\" \"- screenshots,\" \"- final test report.\" APPROVED under \"Use this order:\" (1203). Note the extractor applied the opposite (correct) discipline in PRC-17, where it let a member-level hedge override the binding list header — the same treatment was not applied here."

