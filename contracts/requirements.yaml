    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:608"
    quote: "- must have a clear drag area if decorations are disabled,"
    status_reason: "Explicit \"must have\", conditioned on \"if decorations are disabled\" — the condition governs when it applies, not whether it is binding."

  - id: DOM-43
    title: "Clear close/hide and open-main controls required on the helper"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:609"
    quote: "- must have clear close/hide and open-main controls."
    status_reason: "Explicit \"must have\", no condition."

  - id: DOM-44
    title: "Clicking a helper card opens/focuses the main window"
    status: APPROVED
    category: flow
    source: "CODEX_IMPLEMENTATION_BRIEF.md:613-615"
    quote: "Current helper click merely opens/focuses the main window. Improve this:\n\n- clicking a helper card should open/focus main,"
    status_reason: "§12 itself uses the softer \"should\", but the same behavior is stated as a binding acceptance criterion at §22:1059 (\"Helper card click opens/focuses main and opens matching detail.\") and as an AGENTS.md key acceptance smoke flow, line 96 (\"Click helper card -> main window opens focused on the corresponding detail.\"). AGENTS.md is the harder restatement and carries its own authority."

  - id: DOM-45
    title: "Main opens the corresponding schedule detail automatically on helper deep-link"
    status: APPROVED
    category: flow
    source: "CODEX_IMPLEMENTATION_BRIEF.md:616"
    quote: "- main should open the corresponding schedule detail automatically."
    status_reason: "Hedged \"should\" in §12, but hardened by AGENTS.md key acceptance smoke flow line 96 and acceptance §22:1059 (\"...and opens matching detail\"). Also constrained by AGENTS.md item 8: detail must be a dialog/popover, not a new page."

  - id: DOM-46
    title: "Deep-link implementation mechanism (cross-window event or shared selection state)"
    status: PROVISIONAL
    category: platform
    source: "CODEX_IMPLEMENTATION_BRIEF.md:618"
    quote: "Implement with a simple cross-window event/message or shared selection state. Avoid complex routing if not needed."
    status_reason: "The mechanism is offered as a choice (\"event/message or shared selection state\") and the prohibition is conditional (\"Avoid complex routing if not needed\"), so the contract states a preference rather than fixing an implementation."

  - id: DOM-47
    title: "Calendar must be scrollable downward (explicit user request)"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:624"
    quote: "The user explicitly requested that the calendar can be scrolled downward."
    status_reason: "Recorded as an explicit user request; restated as the non-negotiable AGENTS.md item 6 (\"The calendar body must be vertically scrollable...\"), §5:262 (\"Calendar body itself is vertically scrollable.\") and acceptance §22:1005 (\"Calendar body scrolls vertically.\")."

  - id: DOM-48
    title: "Overall main layout height fits the Tauri window"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:626-628"
    quote: "Recommended implementation:\n\n- overall main layout height fits the Tauri window,"
    status_reason: "Introduced by \"Recommended implementation:\" — the section offers a shape, not a mandate, for this bullet. No harder restatement of this specific bullet found elsewhere in the contract."

  - id: DOM-49
    title: "Header fixed within app layout"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:629"
    quote: "- header is fixed within app layout,"
    status_reason: "Inside the \"Recommended implementation:\" list (line 626). No \"must\" here and no matching acceptance criterion for the app header being fixed (the sticky requirement at §5:261 and §22:1006 concerns the calendar's weekday header, not the app header)."

  - id: DOM-50
    title: "Left D-day list scrolls independently if necessary"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:630"
    quote: "- left D-day list scrolls independently if necessary,"
    status_reason: "Doubly soft: inside \"Recommended implementation:\" and further conditioned by \"if necessary\"."

  - id: DOM-51
    title: "Right calendar has one vertical scroll container"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:631"
    quote: "- right calendar has one vertical scroll container,"
    status_reason: "Inside \"Recommended implementation:\". The fact of vertical scrolling is binding elsewhere (DOM-47, AGENTS.md item 6), but the specific \"one vertical scroll container\" shape is only recommended here; the related hard prohibition is DOM-54 (no scrollbars inside date cells)."

  - id: DOM-52
    title: "Weekday header sticky inside the calendar scroll container"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:632"
    quote: "- weekday header is sticky inside that container,"
    status_reason: "Listed here under \"Recommended implementation:\", but stated as a hard requirement elsewhere in the same contract: §5:261 under \"Requirements:\" (\"Weekday header remains visible/sticky while the calendar body scrolls.\") and acceptance criterion §22:1006 (\"Weekday header stays visible while scrolling.\")."

  - id: DOM-53
    title: "Month week rows not artificially squashed"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:633"
    quote: "- month week rows are not artificially squashed."
    status_reason: "Listed under \"Recommended implementation:\", but backed by the non-negotiable AGENTS.md item 6 (\"do not compress week rows until text becomes unreadable\") and §5:263-264. Note the thresholds differ in wording: \"not artificially squashed\" here vs \"until text becomes unreadable\" in AGENTS.md."
    verify_status_corrected_from: "APPROVED"
    verify_status_reason: "Line 633 sits inside the list introduced at line 626 by \"Recommended implementation:\", and the extractor correctly marked its siblings (DOM-48/49/50/51, lines 628-631) PROVISIONAL for precisely that reason. The elevation to APPROVED is done by importing outside anchors, but unlike DOM-52 those anchors are NOT equivalent statements. AGENTS.md:26 says \"do not compress week rows until text becomes unreadable\" (compression permitted up to a readability limit) and §5:263 says \"Week row/day-cell height is allowed to grow to preserve readable event text.\" Neither text forbids squashing per se, so neither makes \"month week rows are not artificially squashed\" binding — the extractor even records this gap in its own status_reason (\"the thresholds differ in wording\") and in the reported conflicts. Marking it APPROVED asserts a stricter rule than any binding sentence in the contract states. The genuinely binding neighbours are already captured elsewhere (DOM-58 for §5:263; AGENTS.md:26 and §5:264 are outside this range)."

  - id: DOM-54
    title: "No nested vertical scrollbars inside individual date cells"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:635"
    quote: "Do not create nested vertical scrollbars inside individual date cells."
    status_reason: "\"Do not\" prohibition, stated outside the \"Recommended implementation:\" list. §5:265 restates it slightly softer (\"Avoid a scroll area inside each date cell.\")."

  - id: DOM-55
    title: "At startup / Today button: move current month into view"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:637-639"
    quote: "At startup / Today button:\n\n- move current month into view,"
    status_reason: "Imperative bullet, no hedge, stated outside the \"Recommended implementation:\" list. §20:939 restates it (\"Today -> current month + scroll Today into good visible position\")."

  - id: DOM-56
    title: "Position Today near the visible center of the calendar scroll area"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:640"
    quote: "- position Today reasonably near the visible center of the calendar scroll area."
    status_reason: "Imperative \"position\"; the target is fuzzy (\"reasonably near\") but the obligation is not optional. §20:939 uses the equally fuzzy \"good visible position\". No numeric tolerance is given anywhere."

  - id: DOM-57
    title: "Prefer real event names over early collapsing"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:646"
    quote: "Prefer showing real event names over collapsing too early."
    status_reason: "\"Prefer\" — explicitly softer than must, and \"too early\" is undefined. (Separate and harder: AGENTS.md item 3 requires the calendar event text to be \"`vendor name · actual schedule/task name`\", which governs label content, not collapsing.)"

  - id: DOM-58
    title: "Allow day/week height to grow with content"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:648"
    quote: "Because the calendar itself can scroll, allow day/week height to grow with content."
    status_reason: "Imperative \"allow\", no hedge. Restated at §5:263 under \"Requirements:\" (\"Week row/day-cell height is allowed to grow to preserve readable event text.\") and supported by AGENTS.md item 6."

  - id: DOM-59
    title: "No `+N` collapse merely because there are four events"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:650"
    quote: "Do not add a `+N` collapse merely because there are four events."
    status_reason: "\"Do not add\" prohibition with a concrete threshold (\"four events\")."

  - id: DOM-60
    title: "Conservative overflow strategy only after high-density testing"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:650"
    quote: "If an extreme number of events makes the UI unusable, use a conservative overflow strategy only after testing with realistic high-density fixtures."
    status_reason: "Conditional permission (\"If ... makes the UI unusable\") rather than an instruction to build overflow UI; \"extreme number\" and \"conservative\" are undefined. The attached precondition \"only after testing with realistic high-density fixtures\" is binding on anyone who does add overflow UI."

  - id: DOM-61
    title: "Any overflow UI must allow one-click view of all events on that date"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:650"
    quote: "Any overflow UI must still allow a one-click view of all events on that date."
    status_reason: "\"must still allow\" — binding on any overflow implementation, regardless of DOM-60's conditionality."


  # ===== BRIEF §15-§18 (data model, persistence, repo audit, technical constraints) =====
  - id: DAT-01
    title: "Data model target is labelled suggested"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:654"
    quote: "# 15. Data model target (v6 suggested)"
    status_reason: "The section heading itself says \"(v6 suggested)\" — the whole §15 shape is offered, not imposed. Every §15 type below inherits this hedge unless its own wording is harder."

  - id: DAT-02
    title: "Field renaming permitted when migration stays clean"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:656"
    quote: "Codex may rename fields if migration remains clean"
    status_reason: "\"may rename\" is a permission, conditioned on \"if migration remains clean\". Related but separate: AGENTS.md:56 \"Keep a migration path from existing v5 state.\" (outside this range) states the migration obligation itself."

  - id: DAT-03
    title: "Conceptual separation of the model must be preserved"
    status: APPROVED
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:656"
    quote: "but preserve the conceptual separation."
    status_reason: "Imperative \"preserve\" attached as the condition on the renaming permission; it is the one hard clause inside the otherwise \"suggested\" §15. The contract does not define which separations are \"conceptual\"."

  - id: DAT-04
    title: "Settings type shape"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:659-664"
    quote: "type Settings = {\n  horizon: '3' | '5' | '7' | '14' | '30' | 'all' | 'custom';\n  customHorizon: number;\n  helperAlwaysOnTop: boolean;\n  autostart: boolean;\n};"
    status_reason: "Inside §15 \"(v6 suggested)\" (line 654); no must/required wording. The capability behind horizon is independently binding via AGENTS.md:37 item 11 (\"D-day horizon must support finite presets, custom days, and unlimited/all\"), which carries its own authority; the specific preset values '3'|'5'|'7'|'14'|'30' here remain suggested."
    verify_citation_note: "Cross-reference line is off by one: the D-day horizon clause (\"11. D-day horizon must support finite presets, custom days, and **unlimited/all**.\") is AGENTS.md:36, not AGENTS.md:37. The reason also drops the source's bold markers around \"unlimited/all\"."

  - id: DAT-05
    title: "Vendor type shape"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:666-672"
    quote: "type Vendor = {\n  id: string;\n  name: string;\n  person?: string;\n  contact?: string;\n  memo?: string;\n};"
    status_reason: "Inside §15 \"(v6 suggested)\"; no binding verb. AGENTS.md:38 item 12 makes vendor master data user-editable (binding), but not this field list."
    verify_citation_note: "Cross-reference line is off by one: item 12 (\"Vendor templates/master data and work/procedure templates must be user-editable.\") is AGENTS.md:37, not AGENTS.md:38. AGENTS.md:38 is item 13 (the snapshot clause)."

