  # ===== BRIEF §8-§14 (timing model, templates, add-work, helper, scrolling, density) =====
  - id: DOM-01
    title: "`offset` is an integer of days after previous completion"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:461"
    quote: "Current prototype uses an `offset` integer representing days after previous completion."
    status_reason: "Phrased as a description of the \"Current prototype\", not as an obligation; the only instruction attached to it (line 463) says to keep it \"unless expanded later\". The calculation semantics it implies are separately hardened by §22 acceptance line 1039 (\"Next due date = completion date + configured offset when no manual date exists.\")."

  - id: DOM-02
    title: "Keep the simple default offset model (JSON shape shown)"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:463-470"
    quote: "Keep this simple default model unless expanded later:\n\n```json\n{\n  \"name\": \"계약의뢰\",\n  \"offset\": 2\n}\n```"
    status_reason: "\"Keep\" is imperative but the clause self-hedges twice: \"simple default model\" and \"unless expanded later\". The JSON is an illustrative shape (a single sample step), not a stated schema; §15's data model (line 677 `offset: number;`) is itself \"v6 suggested\"."

  - id: DOM-03
    title: "Offset meaning: next step due = previous completion date + offset days"
    status: APPROVED
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:472-474"
    quote: "Meaning:\n\n> when the previous current step is completed, this step’s default due date is completionDate + 2 days."
    status_reason: "Flat statement of the rule (\"is completionDate + 2 days\"); restated as a binding obligation in AGENTS.md item 10 (\"Completing the current procedure step via `OK` must activate the next step and calculate its date according to the configured rule.\") and as acceptance criterion §22:1039. The word \"default\" here is qualified by DOM-05 (manual date wins), not by optionality. Note the \"2 days\" is the example's value, the rule is the configured offset."

  - id: DOM-04
    title: "Offset must be editable in templates and in an individual work's procedure"
    status: APPROVED
    category: flow
    source: "CODEX_IMPLEMENTATION_BRIEF.md:476"
    quote: "The user must be able to edit this offset in templates and in an individual work’s procedure."
    status_reason: "\"must be able to\". Also restated by AGENTS.md item 12 (\"Vendor templates/master data and work/procedure templates must be user-editable.\") and acceptance §22:1049 (\"Steps can be renamed, added, removed, reordered, and offsets changed.\")."

  - id: DOM-05
    title: "Manual due date overrides future automatic calculation for that step"
    status: APPROVED
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:478"
    quote: "A manually edited due date on a concrete step wins over future automatic calculation for that step."
    status_reason: "Flat rule stated with \"wins over\", no hedge; scoped explicitly \"for that step\". Consistent with acceptance §22:1039 (\"...when no manual date exists\")."

  - id: DOM-06
    title: "Vendor \"template\" is conceptually reusable vendor master data"
    status: UNKNOWN
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:484"
    quote: "The user called this a template feature. Conceptually it is reusable vendor master data."
    status_reason: "Terminology/framing sentence with no obligation verb (\"called this\", \"Conceptually it is\"). It does not say whether the UI must use the user's word \"template\" or the brief's term \"vendor master data\"."

  - id: DOM-07
    title: "Vendor master fields: name, contact person, phone/contact, memo"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:486-491"
    quote: "Fields:\n\n- vendor/company name,\n- contact person,\n- phone/contact,\n- memo."
    status_reason: "Stated flatly as \"Fields:\" with no hedge, no \"e.g.\", no \"example\". Force differs from §15:666-672, where the same fields appear inside the \"v6 suggested\" data model with `person?`/`contact?`/`memo?` optional and an explicit licence to rename (\"Codex may rename fields if migration remains clean\")."
    verify_status_corrected_from: "APPROVED"
    verify_status_reason: "Upgraded to APPROVED on the strength of a bare enumeration. Line 486 is just \"Fields:\" followed by four bullets — no \"must\", no \"required\", no \"do not\", and no acceptance criterion anywhere enumerates vendor fields (§22:1047 only says \"Vendor template/master CRUD works.\"). The extractor's own status_reason concedes the contract hedges this exact field set elsewhere: §15 is headed \"# 15. Data model target (v6 suggested)\" (line 654), line 656 states \"Codex may rename fields if migration remains clean\" — an explicit \"may\" — and §15:669-671 mark `person?`, `contact?`, `memo?` optional. Naming a hedge in the reason and then still stamping APPROVED is exactly the upgrade the rules forbid. The binding obligation in this area is DOM-09 (§9:501 \"Do not force the user to retype vendor contact data per work.\"), which is already captured separately; the specific four-field list is not binding."

  - id: DOM-08
    title: "Vendor master requirements: add, edit, delete when unused, selectable in both creation flows"
    status: APPROVED
    category: flow
    source: "CODEX_IMPLEMENTATION_BRIEF.md:493-499"
    quote: "Requirements:\n\n- add,\n- edit,\n- delete when unused,\n- selection during work/project creation,\n- selection during one-off schedule creation."
    status_reason: "The list is literally headed \"Requirements:\". Reinforced by AGENTS.md item 12 (\"Vendor templates/master data ... must be user-editable.\"). Note the qualifier \"delete when unused\" limits the delete capability; \"unused\" is not defined (see silences)."

  - id: DOM-09
    title: "Never force retyping vendor contact data per work"
    status: APPROVED
    category: flow
    source: "CODEX_IMPLEMENTATION_BRIEF.md:501"
    quote: "Do not force the user to retype vendor contact data per work."
    status_reason: "\"Do not\" prohibition. Consistent with AGENTS.md mission line 13 (\"Using the app must not become another job.\")."

  - id: DOM-10
    title: "Destructive deletion of a referenced vendor must be prevented or converted to migration/archive"
