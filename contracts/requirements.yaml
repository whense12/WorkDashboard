    verify_citation_note: "Cross-reference line is off by one: \"- work-log entry area,\" is AGENTS.md:32, not AGENTS.md:33. AGENTS.md:33 is \"- file attachments,\". (Item 9 itself begins at AGENTS.md:29.)"

  - id: DAT-10
    title: "ProcedureStep type shape carrying logs and attachments"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:702-712"
    quote: "type ProcedureStep = {\n  id: string;\n  name: string;\n  offset: number;\n  dueDate: string | null;\n  completed: boolean;\n  completedAt: string | null;\n  memo?: string;\n  logs: WorkLog[];\n  attachments: AttachmentMeta[];\n};"
    status_reason: "Inside §15 \"(v6 suggested)\"; no binding verb on the shape. The behaviour that logs/attachments/completion history survive editing is separately binding at line 853 (\"ensure reorder/edit does not drop logs/attachments/completion history\") and AGENTS.md:35 item 10 covers next-step date calculation."
    verify_citation_note: "status_reason cites \"line 853\" for \"ensure reorder/edit does not drop logs/attachments/completion history\"; that clause is at line 852."

  - id: DAT-11
    title: "Project type shape with steps snapshot"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:714-721"
    quote: "type Project = {\n  id: string;\n  vendorId: string;\n  name: string;\n  memo?: string;\n  templateId?: string;\n  steps: ProcedureStep[]; // snapshot\n};"
    status_reason: "The shape sits inside §15 \"(v6 suggested)\", so the field list is suggested — but the \"// snapshot\" semantics it encodes is independently binding via AGENTS.md:38 item 13 (\"A work instantiated from a template must own a snapshot of its procedure steps. Later template edits must not silently rewrite active/historical work.\"), which is the harder restatement and carries its own authority."
    verify_citation_note: "Line ref AGENTS.md:38 is correct, but the quote drops the source's bold markers: the file reads \"must own a **snapshot** of its procedure steps.\""

