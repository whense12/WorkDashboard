   Pretendard / SIL Open Font License 1.1 — frontend/fonts/LICENSE.txt */
@font-face{
  font-family:"Pretendard Variable";
  src:url("frontend/fonts/PretendardVariable.woff2") format("woff2-variations");
  font-weight:45 920;font-style:normal;font-display:swap;
}
:root{
  /* 색 — KRDS 라이트 테마 토큰. 괄호 안은 흰 배경 대비율(실측).
     초록을 앱 강조색이자 Today 색으로 쓰던 것을 바꾼다. 초록은 보편적으로 '완료/정상'을
     뜻하는데, 누락 방지가 목적인 앱에서 "오늘 = 초록"은 "오늘 = 괜찮음"으로 읽힌다.
     강조색은 중립적인 파랑으로 옮기고, 초록은 완료에만 쓴다.
     시간 긴급도는 파랑(예정) -> 주황(오늘) -> 빨강(지남) 한 축으로만 표현한다. */

  --line-strong:#cdd1d5;
  --accent:#0b50d0;        /* primary-60  (6.83) 텍스트·아이콘·주버튼 배경 */
  --accent-line:#256ef4;   /* primary-50  Today 테두리/바 */
  --accent-soft:#ecf2fe;   /* primary-5 */
  --today:#e3ecfd;
  --danger:#bd2c0f;--danger-soft:#fdefec;   /* danger-60 (5.95) / danger-5  — 지남 */
  --warn:#8a5c00;--warn-soft:#fff3db;       /* warning-60 (5.4) / warning-5 — 오늘 */
  --done:#267337;--done-soft:#eaf6ec;       /* success-60 (5.5) / success-5 — 완료 전용 */
  --shadow:0 8px 24px rgba(19,20,22,.06);
  --r:14px;

  /* 타입 스케일 — KRDS(범정부 UI/UX 디자인시스템) PC 토큰.
     13px 가 하한이다. 발주서 §19.3 의 "본문 13-14px, 캘린더 이벤트를 마이크로텍스트로
     만들지 말 것" 과 같은 값이다. 개별 규칙에서 px 를 직접 쓰지 말고 이 토큰만 쓴다. */
  --fs-xs:13px;   /* KRDS body/label-xsmall — 보조 텍스트 하한 */

  --fs-md:17px;   /* KRDS heading-xsmall — 업체명, D-day 등 1순위 정보 */
  --fs-lg:19px;   /* KRDS heading-small — 패널·모달 제목 */

  --ctl-h:40px;    /* 표준 컨트롤 높이 (발주서 §19.4: 36-40px) */
  --ctl-h-sm:36px;
}

/* 기간 일정 — 시작~종료 모든 날짜 칸에 칩이 선다. 월 그리드가 날짜 칸 단위라 진짜 하나로
   이어진 막대는 아니다. 시작 칸만 왼쪽을, 종료 칸만 오른쪽을 둥글게 하고 이어지는 칸은
   톤을 낮춰 하나의 띠로 읽히게 한다. 클릭 대상은 매일 살아 있다. */
.event.period{border-radius:0;margin-left:-7px;margin-right:-7px;padding-left:7px;padding-right:7px}

/* helper — 창이 아니라 바탕화면 악세사리다.
   네이티브 창은 투명·무장식으로 두고(transparent, decorations:false, shadow:false)
   둥근 모서리와 그림자를 CSS 로 그린다. 제목표시줄처럼 보이는 요소를 두지 않는다:
   구분선이 그어진 회색 헤더 하나가 "이건 창이다"로 읽히게 만든다.
   바깥 여백은 그림자가 그려질 자리이자 실제로 투명한 영역이다. */
html.helper,body.helper-body{background:transparent}
.helper-body{padding:11px;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
.helper-shell{height:calc(100vh - 22px);display:flex;flex-direction:column;
  background:rgba(255,255,255,.96);border:1px solid rgba(30,33,36,.10);border-radius:18px;
  box-shadow:0 16px 38px rgba(19,20,22,.30),0 2px 6px rgba(19,20,22,.16);overflow:hidden}
.helper-grip{display:flex;align-items:center;gap:6px;padding:9px 8px 6px 10px;flex:0 0 auto}
/* 잡는 자리라는 것만 알려 주는 표시. 창틀이 아니다. */
.helper-handle{width:4px;height:16px;border-radius:2px;background:rgba(30,33,36,.16);flex:0 0 auto}
.helper-grip strong{font-size:var(--fs-sm);font-weight:850;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.helper-chip{font-size:var(--fs-xs);font-weight:800;color:var(--muted);background:rgba(30,33,36,.06);border-radius:999px;padding:2px 8px;flex:0 0 auto}
.helper-icon{width:27px;height:27px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:17px;line-height:1;display:grid;place-items:center;flex:0 0 auto;padding:0}
.helper-icon:hover{background:rgba(30,33,36,.09);color:var(--ink)}
.helper-icon.add{color:var(--accent);font-size:20px;font-weight:700}
.helper-icon.add:hover{background:var(--accent-soft)}
/* 빠른 추가 — 이름과 날짜만. 나머지는 본체에서 채운다. */
.helper-quick{margin:2px 9px 6px;padding:8px;border-radius:12px;background:var(--accent-soft);display:grid;gap:6px;flex:0 0 auto}
/* display 를 지정하면 UA 의 [hidden]{display:none} 을 이겨 폼이 늘 펼쳐진 채로 남는다. */
.helper-quick[hidden]{display:none}
.helper-quick input,.helper-quick select{width:100%;height:var(--ctl-h-sm);border:1px solid #cdd1d5;border-radius:8px;background:#fff;padding:0 8px;font-size:var(--fs-xs)}
.helper-quick .q-row{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:6px}
.helper-quick .q-row.two{grid-template-columns:1fr 1fr}
.helper-quick .q-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.helper-quick .q-msg{flex:1;font-size:var(--fs-xs);color:var(--danger);font-weight:750}
.helper-quick .q-save{height:var(--ctl-h-sm);border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:var(--fs-xs);font-weight:850;padding:0 14px}
.helper-quick .q-save:hover{background:#083891}
.helper-list{padding:0 9px 8px;display:grid;gap:6px;overflow:auto;align-content:start}.helper-card{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;text-align:left}.helper-card:hover{background:#fafbfc}.helper-vendor{display:block;font-size:var(--fs-sm);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.helper-task{display:block;font-size:var(--fs-xs);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.helper-sub{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.helper-dday{min-width:56px;height:42px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:var(--fs-sm);font-weight:900}.helper-card.today .helper-dday{background:var(--warn-soft);color:var(--warn)}.helper-card.overdue .helper-dday{background:var(--danger-soft);color:var(--danger)}.helper-footer{margin-top:auto;flex:0 0 auto;padding:7px 12px 9px;font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}

.section-headline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}.section-headline b{display:block;font-size:var(--fs-sm)}.section-headline span{display:block;margin-top:2px;font-size:var(--fs-xs);color:var(--muted)}

.file-btn{min-height:34px;height:34px;padding:0 10px;font-size:var(--fs-xs)}.attachment-list{display:grid;gap:5px}.attachment-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 8px}.file-icon{width:24px;height:24px;border-radius:6px;background:#eef0f3;color:var(--accent);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:900}.attachment-main{min-width:0}.attachment-main b{display:block;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-main small{display:block;margin-top:1px;color:var(--muted);font-size:var(--fs-xs)}.attachment-note{font-size:var(--fs-xs);color:var(--muted);margin-top:6px;line-height:1.4}
.steps-head>div:first-child{min-width:0}.steps-sub{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}.step{grid-template-columns:24px minmax(0,1fr) auto}.step.done .step-name{text-decoration:none;color:#58616a}.step.future .step-name{color:#33363d}.step-status{font-size:var(--fs-xs);white-space:nowrap;border-radius:999px;padding:3px 6px}.step-status.done{background:#eef0f3;color:#58616a}.step-status.current{background:var(--accent-soft);color:var(--accent);font-weight:850}.step-status.future{background:#f4f5f6;color:#58616a}.step.future .step-mark{background:#f4f5f6;color:#8a949e}.step.current{background:#fafbfc}.step.current .step-name{font-weight:850}

/* Lucide 아이콘 (ISC). 스프라이트는 index.html 안에 인라인으로 심는다 — Tauri 는 오프라인이다. */
.sprite{display:none}
.ico{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brandmark .ico{width:19px;height:19px}
.close .ico{width:18px;height:18px}

/* 완료 상태 배지 — 초록은 여기서만 쓴다. */
.detail-dday.done{background:var(--done-soft);color:var(--done)}

/* 용어·항목 탭 */
.terms-note{font-size:var(--fs-xs);color:var(--muted);margin-bottom:10px;line-height:1.5}
.terms-preview{margin-top:12px;border:1px solid var(--accent-line, var(--line));background:var(--accent-soft);border-radius:10px;padding:11px 13px;display:grid;gap:4px}
.terms-preview b{font-size:var(--fs-xs);color:var(--accent);letter-spacing:.02em}
.terms-preview span{font-size:var(--fs-xs);color:var(--ink)}
#vfList .proc-row{grid-template-columns:58px minmax(0,1fr) 116px 64px}
/* 업체·업무·일정을 한 모달에서 등록할 때 쓰는 일정 행 */
.ev-list{display:grid;gap:5px}
.ev-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 56px;gap:5px;align-items:center}
.ev-row.two{grid-template-columns:1fr 1fr}
.ev-row input{width:100%;height:var(--ctl-h-sm);border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:var(--fs-sm)}
.ev-row .remove{height:var(--ctl-h-sm);border:1px solid var(--line);background:#fff;border-radius:7px;font-size:var(--fs-xs);color:var(--danger);font-weight:750}
.ev-row .remove:hover{background:var(--danger-soft)}
/* 고른 업체를 칩으로 보여 준다. 몇 곳을 골랐는지 한눈에 보여야 한다. */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chips:empty{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-size:var(--fs-xs);font-weight:850}
.chip button{width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:15px;line-height:1;display:grid;place-items:center}
.chip button:hover{background:rgba(11,80,208,.16)}
/* 업체별 개별 조정 — 공통값과 다른 줄만 눈에 띄게 */
.pv-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 70px;gap:5px;align-items:center}
.pv-row input{width:100%;height:var(--ctl-h-sm);border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:var(--fs-sm)}
.pv-name{font-size:var(--fs-sm);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-row.custom input{border-color:var(--accent-line);background:var(--accent-soft)}
.pv-reset{height:var(--ctl-h-sm);border:1px solid var(--line);background:#fff;border-radius:7px;font-size:var(--fs-xs);font-weight:750;color:var(--muted)}
.pv-row.custom .pv-reset{color:var(--accent);border-color:var(--accent-line)}
.pv-reset[disabled]{opacity:.45;cursor:default}
.bi-row{grid-template-columns:110px minmax(0,1fr) 140px 56px}
.bi-head{display:grid;grid-template-columns:110px minmax(0,1fr) 140px 56px;gap:5px;margin-top:14px;font-size:var(--fs-xs);color:var(--muted);font-weight:800;padding:0 2px}

/* 예산 — 캘린더·업체별과 같은 자리를 쓰는 세 번째 축.
   색은 기존 규칙 그대로: 기지출 초록(집행 완료) · 지출예정 파랑(예정) · 잔액 회색 · 초과 빨강. */
.budget-board{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:9px;display:grid;gap:9px;align-content:start}
.bg-summary{border:1px solid var(--line);border-radius:12px;background:var(--sub);padding:11px 12px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:"total figs actions" "bar bar bar" "title title title";gap:9px 16px;align-items:center}
.bg-total{grid-area:total;display:grid}
.bt-k{font-size:var(--fs-xs);color:var(--muted);font-weight:800}

.bg-summary>.bg-figs{grid-area:figs}
.bg-actions{grid-area:actions;display:flex;gap:6px}
.bg-summary>.bg-bar{grid-area:bar}
.bg-title{grid-area:title;font-size:var(--fs-xs);color:var(--muted)}
.bg-bar{display:flex;height:8px;border-radius:999px;background:#e6e8ea;overflow:hidden}
.bg-bar i{display:block;height:100%}

.bg-bar i.p{background:var(--accent)}

.fig em{font-style:normal;font-size:var(--fs-xs);color:var(--muted);font-weight:750}
.fig b{font-size:var(--fs-sm);font-weight:900;font-variant-numeric:tabular-nums}
.fig.s b{color:var(--done)}
.fig.p b{color:var(--accent)}
.fig.r.neg b{color:var(--danger)}
.bg-list{display:grid;gap:7px}
.bg-row{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.bg-row.open{border-color:var(--line-strong)}
.bg-head{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;
  display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(110px,.9fr) auto;gap:14px;align-items:center}
.bg-head:hover{background:#fafbfc}
.bg-name{display:block;font-size:var(--fs-md);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg-code{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:3px}
.bg-amount{font-size:var(--fs-sm);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.bg-body{display:none;padding:0 10px 10px;gap:6px;grid-template-columns:1fr}
.bg-row.open .bg-body{display:grid}
.bg-project{border:1px solid var(--line);border-radius:9px;background:var(--sub);overflow:hidden}
.bp-head{width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.bp-head:hover{background:#f0f1f3}
.bp-name{font-size:var(--fs-sm);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-figs{display:flex;gap:10px;font-size:var(--fs-xs);color:var(--muted);font-weight:750;white-space:nowrap}
.bp-total{font-size:var(--fs-sm);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.bp-body{display:none;padding:0 8px 8px;gap:5px;grid-template-columns:1fr}
.bg-project.open .bp-body{display:grid}
.bg-vendor{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px}
.bv-head{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-xs);font-weight:850;padding:3px 5px 5px}
.bv-total{font-variant-numeric:tabular-nums}
.bg-spend{width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:5px 6px;
  display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:9px;align-items:center;font-size:var(--fs-xs)}
.bg-spend:hover{background:var(--sub)}
.bs-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750}
.bs-date{color:var(--muted)}
.bs-status{border-radius:999px;padding:2px 8px;font-weight:850}
.bs-status.spent{color:var(--done);background:var(--done-soft)}
.bs-status.planned{color:var(--accent);background:var(--accent-soft)}

.cb{position:relative}
.cb-native{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.cb-input{width:100%;height:var(--ctl-h);border:1px solid #cdd1d5;border-radius:8px;background:#fff;padding:0 30px 0 11px;font-size:var(--fs-sm)}

.cb-opt.active{background:var(--accent-soft);color:var(--accent)}
.cb-opt[aria-selected="true"]{font-weight:850}
/* 만들기 줄은 목록과 구분되어야 한다. 실수로 새 업체를 만들면 안 된다. */
.cb-opt.create{margin-top:4px;border-top:1px solid var(--line);padding-top:9px;color:var(--accent);font-weight:800;border-radius:0 0 7px 7px}
.cb-opt.create.active{background:var(--accent-soft)}
.cb-empty{padding:9px 10px;font-size:var(--fs-xs);color:var(--muted)}
#vfList select{height:var(--ctl-h-sm);border:1px solid var(--line);border-radius:7px;padding:0 6px;font-size:var(--fs-xs);background:#fff}

(function(){
  // 저장 키는 v5 그대로 둔다. 키를 올리면 기존 사용자의 v5 데이터가 통째로 고아가 된다.
  // 스키마 버전은 상태 안의 version 필드와 migrate() 가 관리한다.
  const KEY='work-calendar-state-v5';
  const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+Number(n||0));return iso(d)};
  const diffDays=(s,base=todayISO())=>Math.round((parse(s)-parse(base))/86400000);
  const pretty=s=>{if(!s)return'';const d=parse(s);return `${d.getMonth()+1}.${d.getDate()}.`};
  // ── 기간 ────────────────────────────────────────────────────────────────
  // 일정이 마감일 하나로만 표현돼 있었다. 행사참여기간·접수기간처럼 시작과 끝이 있는 일은
  // 두 건으로 쪼개 넣어야 했고, 둘이 이어져 있다는 사실이 화면 어디에도 남지 않았다.
  // endDate 가 없으면 지금까지와 완전히 같게 동작한다.
  const endOf=r=>{const st=r?.date;if(!st)return null;const e=r.endDate;return e&&e>st?e:st};
  const isPeriod=r=>!!(r&&r.date&&r.endDate&&r.endDate>r.date);
  const periodDays=r=>isPeriod(r)?diffDays(r.endDate,r.date)+1:1;
  const spansDay=(r,ds)=>{const st=r?.date;return !!st&&ds>=st&&ds<=endOf(r)};
  /** 'before' 시작 전 · 'on' 당일(단일) · 'during' 기간 중 · 'after' 지남 */
  function phaseOf(r,base=todayISO()){
    if(!r?.date)return 'none';
    if(base<r.date)return 'before';
    if(!isPeriod(r))return base>r.date?'after':'on';
    return base>r.endDate?'after':'during';
  }
  // 정렬과 기준일 필터가 쓰는 날짜. 이미 시작한 행사가 D-14 기준 밖으로 밀려나면 안 된다.
  const sortDate=r=>phaseOf(r)==='during'?todayISO():(r?.date||'');

  // ── 용어 ─────────────────────────────────────────────────────────────────
  // 발주서 §1: 도메인 규칙을 하드코딩하지 말 것. 시드 절차명은 예시일 뿐 정책이 아니다.
  // 그런데 '업체/업무/절차/일정' 이 화면 문자열에 박혀 있어 다른 업무에는 쓸 수 없었다.

  // 한국어 조사. 용어를 바꿀 수 있게 하면 "거래처을 선택" 같은 문장이 나온다.
  // 한글 음절은 0xAC00 부터 종성 28개 주기를 가지므로 (코드-0xAC00)%28 이 0 이면 받침이 없다.
  // 근사가 아니라 규칙이다.
  function finalJamo(w){
    const s=String(w??'');if(!s)return -1;
    const c=s.charCodeAt(s.length-1);
    if(c<0xac00||c>0xd7a3)return -1;      // 한글 음절이 아니면 판정하지 않는다
    return (c-0xac00)%28;                  // 0 = 받침 없음, 8 = ㄹ
  }
  /** josa('업체',['을','를']) -> '업체를' · pair[0]=받침 있을 때, pair[1]=없을 때 */
  function josa(word,pair){
    const w=String(word??''),j=finalJamo(w);
    if(pair[0]==='으로')return w+(j<0||j===0||j===8?'로':'으로');   // ㄹ 받침은 '로'
    if(j<0)return w+pair[1];                                          // 한글이 아니면 받침 없는 쪽
    return w+(j===0?pair[1]:pair[0]);
  }

      // ── 예산 ────────────────────────────────────────────────────────────
      viewBudget:'예산',

  }

  // 업체 마스터의 항목도 도메인마다 다르다. 고정 3개 대신 사용자 정의로 둔다.

  // 저장된 상태를 현재 스키마로 올린다. 버전을 무조건 덮어쓰지 않고 단계별로 통과시켜야
  // 다음 스키마 변경 때 기존 데이터를 안전하게 이관할 수 있다.
  function migrate(s){
    let v=Number(s.version||0);
    if(v<6){
      // v5 -> v6: 필드 구조 변경 없음. pendingSelection(창 간 딥링크)만 새로 쓰인다.
      if(!('pendingSelection' in s))s.pendingSelection=null;
      v=6;
    }
    if(v<7){
      // v6 -> v7: 용어 사전과 업체 커스텀 항목이 생긴다.
      // 기존 담당자/연락처/메모 값을 기본 3개 항목으로 옮기되, 원본 키는 지우지 않는다(§21).
      s.terms=s.terms||defaultTerms();
      if(!Array.isArray(s.vendorFields)||!s.vendorFields.length){
        s.vendorFields=defaultVendorFields();
        (Array.isArray(s.vendorTemplates)?s.vendorTemplates:[]).forEach(x=>{
          x.values=x.values||{};
          const carry={'vf-person':x.person,'vf-contact':x.contact,'vf-memo':x.memo};
          for(const [k,val] of Object.entries(carry))if(val!==undefined&&x.values[k]===undefined)x.values[k]=val;
        });
      }
      v=7;
    }
    if(v<8){
      // v7 -> v8: 예산과 지출이 생긴다. 기존 필드는 하나도 건드리지 않는다.
      if(!s.budget||typeof s.budget!=='object')s.budget={title:'',year:null,items:[]};
      if(!Array.isArray(s.budget.items))s.budget.items=[];
      if(!Array.isArray(s.spends))s.spends=[];
      v=8;
    }
    if(v<9){
      // v8 -> v9: 행사(그룹)가 생긴다.
      // project.vendorId 가 업체 한 곳이라 '한 행사에 업체 10곳'을 담을 수 없었다.
      // 업무는 그대로 '업체 × 행사' 참여 건으로 두고, 그 위에 행사를 얹는다.
      // 기존 필드는 하나도 건드리지 않는다 — 행사를 안 쓰면 v8 과 똑같이 돈다.
      if(!Array.isArray(s.groups))s.groups=[];
      (Array.isArray(s.projects)?s.projects:[]).forEach(p=>{if(!('groupId' in p))p.groupId=null});
      v=9;
    }
    s.version=v;
    return s;
  }

  function normalizeState(x){
    const s=migrate(x&&typeof x==='object'?x:clone(seed));
    s.settings=s.settings||clone(seed.settings);
    s.pendingSelection=s.pendingSelection||null;
    s.terms={...defaultTerms(),...(s.terms||{})};
    s.vendorFields=Array.isArray(s.vendorFields)&&s.vendorFields.length?s.vendorFields:defaultVendorFields();
    s.vendorTemplates=Array.isArray(s.vendorTemplates)?s.vendorTemplates:[];
    s.vendorTemplates.forEach(x=>{x.values=x.values&&typeof x.values==='object'?x.values:{}});
    s.workTemplates=Array.isArray(s.workTemplates)?s.workTemplates:[];
    s.projects=Array.isArray(s.projects)?s.projects:[];
    s.manualEvents=Array.isArray(s.manualEvents)?s.manualEvents:[];
    s.budget={title:'',year:null,...(s.budget||{})};
    s.budget.items=Array.isArray(s.budget.items)?s.budget.items:[];
    s.spends=Array.isArray(s.spends)?s.spends:[];
    s.groups=Array.isArray(s.groups)?s.groups:[];
    s.projects.forEach(p=>{if(!('groupId' in p))p.groupId=null});

  }
  // ── 첨부 저장 ────────────────────────────────────────────────────────────
  // 데스크톱은 앱 전용 폴더에 실제 파일로, 웹은 IndexedDB Blob 으로 저장한다(§16.2).
  //
  // 권한 표면을 좁히려고 "사용자가 고른 임의 경로에 쓰기"를 아예 만들지 않았다.
  // 백업 내보내기도 앱 폴더에 쓴 뒤 그 폴더를 탐색기로 열어 주는 방식이라,
  // 앱은 자기 데이터 디렉터리 밖을 건드릴 수 없다(§26).
  const ATTACH_DIR='attachments',BACKUP_DIR='backups',BACKUP_KEEP=7;
  const SAFE_ID=/^[A-Za-z0-9_-]+$/;
  const fsApi=()=>window.__TAURI__?.fs;
  const pathApi=()=>window.__TAURI__?.path;
  const openerApi=()=>window.__TAURI__?.opener;
  const nativeFiles=()=>!!(window.__TAURI__?.core&&fsApi()?.writeFile);
  const appDir=()=>fsApi().BaseDirectory.AppLocalData;
  const extOf=n=>{const m=/\.([A-Za-z0-9]{1,12})$/.exec(String(n||''));return m?m[1].toLowerCase():'bin'};
  function attachPath(entityId,attId,ext){
    // 물리 파일명에 사용자 입력이 절대 들어가지 않게 한다. id 는 uid() 산출물이지만 한 번 더 막는다.
    if(!SAFE_ID.test(String(entityId))||!SAFE_ID.test(String(attId)))throw new Error('첨부 경로에 쓸 수 없는 식별자입니다.');
    return `${ATTACH_DIR}/${entityId}/${attId}.${SAFE_ID.test(ext)?ext:'bin'}`;
  }
  const ATTACH_DB='work-calendar-attachments-v1',ATTACH_STORE='files';
  function openAttachmentDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}const req=indexedDB.open(ATTACH_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(ATTACH_STORE))db.createObjectStore(ATTACH_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  async function idbPut(row){const db=await openAttachmentDB();await new Promise((resolve,reject)=>{const tx=db.transaction(ATTACH_STORE,'readwrite');tx.objectStore(ATTACH_STORE).put(row);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
  async function idbGet(id){const db=await openAttachmentDB();const row=await new Promise((resolve,reject)=>{const req=db.transaction(ATTACH_STORE,'readonly').objectStore(ATTACH_STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});db.close();return row}
  async function idbDelete(id){try{const db=await openAttachmentDB();await new Promise((resolve,reject)=>{const tx=db.transaction(ATTACH_STORE,'readwrite');tx.objectStore(ATTACH_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('attachment delete failed',e)}}

  // 발주서 §15 의 AttachmentMeta 형태로 돌려준다. backend 로 어디에 실물이 있는지 구분한다.
  async function storeAttachmentBytes(entityId,meta,bytes){
    if(nativeFiles()){
      const rel=attachPath(entityId,meta.id,extOf(meta.name)),fs=fsApi();
      await fs.mkdir(`${ATTACH_DIR}/${entityId}`,{baseDir:appDir(),recursive:true});
      await fs.writeFile(rel,bytes,{baseDir:appDir()});
      return {...meta,backend:'tauri-fs',relativePath:rel};
    }
    await idbPut({...meta,blob:new Blob([bytes],{type:meta.type||'application/octet-stream'})});
    return {...meta,backend:'indexeddb',relativePath:undefined};
  }
  async function putAttachment(file,entityId){
    const meta={id:uid('att'),name:file.name,type:file.type||'application/octet-stream',size:file.size,addedAt:new Date().toISOString()};
    return storeAttachmentBytes(entityId,meta,new Uint8Array(await file.arrayBuffer()));
  }
  // 실물이 없으면 ATTACHMENT_MISSING 을 던진다. 호출부는 파괴적이지 않게 안내만 한다(인수조건 D).
  async function readAttachment(meta){
    if(meta?.backend==='tauri-fs'&&meta.relativePath){
      if(!nativeFiles())throw new Error('ATTACHMENT_MISSING');
      const fs=fsApi();
      if(!await fs.exists(meta.relativePath,{baseDir:appDir()}))throw new Error('ATTACHMENT_MISSING');
      return {bytes:await fs.readFile(meta.relativePath,{baseDir:appDir()}),name:meta.name,type:meta.type};
    }
    const row=await idbGet(meta.id);
    if(!row?.blob)throw new Error('ATTACHMENT_MISSING');
    return {bytes:new Uint8Array(await row.blob.arrayBuffer()),name:row.name||meta.name,type:row.type||meta.type};
  }
  async function deleteAttachment(meta){
    if(!meta)return;
    if(meta.backend==='tauri-fs'&&meta.relativePath&&nativeFiles()){
      try{await fsApi().remove(meta.relativePath,{baseDir:appDir()})}catch(e){console.warn('첨부 파일 삭제 실패',e)}
      return;
    }
    await idbDelete(meta.id);
  }
  function attachmentsOf(entities){return entities.flatMap(e=>Array.isArray(e?.attachments)?e.attachments:[])}
  async function purgeAttachments(metas){for(const m of metas)await deleteAttachment(m)}
  // 데스크톱에서 첨부를 OS 기본 프로그램으로 연다. 웹은 호출부가 Blob 다운로드로 처리한다.
  async function revealAttachment(meta){
    if(!(meta?.backend==='tauri-fs'&&meta.relativePath&&openerApi()&&pathApi()))return false;
    const base=await pathApi().appLocalDataDir();
    await openerApi().openPath(await pathApi().join(base,meta.relativePath));
    return true;
  }
  function formatBytes(n){n=Number(n||0);if(n<1024)return`${n} B`;if(n<1048576)return`${(n/1024).toFixed(n<10240?1:0)} KB`;return`${(n/1048576).toFixed(n<10485760?1:0)} MB`}
  let store=null;let memoryState=normalizeState(clone(seed));
  const isTauri=()=>!!(window.__TAURI__?.core);
  async function initStorage(){
    if(isTauri() && window.__TAURI__?.store?.load){
      try{
        store=await window.__TAURI__.store.load('work-calendar.json',{autoSave:150});
        const value=await store.get('state');
        if(value) return normalizeState(value);
        await store.set('state',clone(seed));await store.save();return normalizeState(clone(seed));
      }catch(e){console.warn('Tauri store fallback',e)}
    }
    try{const raw=localStorage.getItem(KEY);if(raw)return normalizeState(JSON.parse(raw))}catch(e){}
    try{localStorage.setItem(KEY,JSON.stringify(seed));}catch(e){} memoryState=normalizeState(clone(seed));return clone(memoryState);
  }
  // Tauri Store 의 onKeyChange 는 "내가 방금 쓴 값"에도 발화한다. 그대로 두면 저장할 때마다
  // 상태 객체가 통째로 교체되어, 템플릿 편집기처럼 배열을 직접 참조하는 화면에서 입력이 유실된다.
  // _rev 로 자기가 쓴 변경인지 구분해 걸러낸다.
  let lastRev=0;
  async function saveState(state){state=normalizeState(state);
    state._rev=lastRev=(Number(state._rev)||0)+1;
    if(store){await store.set('state',state);await store.save();}
    else {try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){memoryState=clone(state)}}
    try{new BroadcastChannel(KEY).postMessage({type:'state'});}catch(e){}
  }
  async function watchState(cb){
    // 콜백에는 항상 정규화된 상태를 넘긴다. 이전에는 store 경로에서 원본을 그대로 넘겨
    // 정규화되지 않은 객체가 화면으로 들어갔다.
    const relay=v=>{if(!v)return;const s=normalizeState(v);if(s._rev&&s._rev===lastRev)return;cb(s)};
    if(store?.onKeyChange){try{return await store.onKeyChange('state',relay);}catch(e){}}
    window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{relay(JSON.parse(e.newValue))}catch(_){}}});
    try{const bc=new BroadcastChannel(KEY);bc.onmessage=async()=>{relay(await readState())};}catch(e){}
  }
  async function readState(){if(store){return normalizeState((await store.get('state'))||clone(seed))}try{return normalizeState(JSON.parse(localStorage.getItem(KEY)||'null')||clone(memoryState))}catch(e){return clone(memoryState)}}
  function vendor(state,id){return state.vendorTemplates.find(v=>v.id===id)}
  function project(state,id){return state.projects.find(p=>p.id===id)}
  function group(state,id){return (state.groups||[]).find(g=>g.id===id)}
  /** 그 행사의 참여 건(업무)들. 업무 하나가 '업체 × 행사' 한 칸이다. */
  const projectsOfGroup=(state,gid)=>state.projects.filter(p=>p.groupId===gid);
  function currentStep(p){return p?.steps?.find(s=>!s.completed)||null}
  function eventRecords(state){
    const rows=[];
    // 절차 단계에는 기간을 주지 않는다. 절차는 본질적으로 마감일이고, 기간을 주면 의미가 흐려진다.
    state.projects.forEach(p=>p.steps.forEach(s=>{if(s.dueDate)rows.push({kind:'step',id:s.id,date:s.dueDate,endDate:null,name:s.name,completed:!!s.completed,vendorId:p.vendorId,projectId:p.id,memo:s.memo||p.memo||'',step:s})}));
    state.manualEvents.forEach(m=>rows.push({kind:'manual',id:m.id,date:m.date,endDate:m.endDate||null,name:m.name,completed:!!m.completed,vendorId:m.vendorId,projectId:m.projectId||null,memo:m.memo||'',manual:m}));
    return rows;
  }
  function horizonDays(settings){if(settings.horizon==='all')return Infinity;if(settings.horizon==='custom')return Math.max(1,Number(settings.customHorizon||1));return Number(settings.horizon||14)}
  function dueCards(state){
    const max=horizonDays(state.settings),future=eventRecords(state).filter(e=>!e.completed&&e.date);
    const groups=new Map();
    future.forEach(e=>{const arr=groups.get(e.vendorId)||[];arr.push(e);groups.set(e.vendorId,arr)});
    const cards=[];
    groups.forEach((arr,vendorId)=>{arr.sort((a,b)=>sortDate(a).localeCompare(sortDate(b))||a.date.localeCompare(b.date));const first=arr[0],d=diffDays(sortDate(first));if(d<=max||d<0||max===Infinity)cards.push({...first,extra:arr.length-1,dday:d})});
    return cards.sort((a,b)=>sortDate(a).localeCompare(sortDate(b))||a.date.localeCompare(b.date));
  }
  // ── 업체별 요약 ──────────────────────────────────────────────────────────
  // 대시보드의 두 번째 축. 좌측 레일과 캘린더가 "언제"를 묻는다면 여기는
  // "이 업체는 지금 어디까지 왔나"를 묻는다. 업체가 전화를 걸어 왔을 때 필요한 화면이다.
  //
  // 집계를 화면 코드에 두면 좌측 레일과 숫자가 조용히 어긋난다.
  // eventRecords() 와 같은 규칙 위에서 계산한다.
  function vendorSummaries(state){
    const byVendor=new Map();
    const bucket=id=>{
      const key=id||'';
      if(!byVendor.has(key))byVendor.set(key,{vendorId:id||null,vendor:vendor(state,id)||null,
        items:[],openCount:0,doneCount:0,stepsDone:0,stepsTotal:0,overdueCount:0,next:null,spent:0,planned:0});
      return byVendor.get(key);
    };
    state.projects.forEach(p=>{
      const b=bucket(p.vendorId),steps=p.steps||[];
      const done=steps.filter(s=>s.completed).length;
      b.stepsDone+=done;b.stepsTotal+=steps.length;
      const cur=currentStep(p);
      if(cur)b.openCount++;else b.doneCount++;
      // 클릭 대상은 "아직 안 끝났고 날짜가 잡힌 단계". 날짜 미정이면 열 상세가 없다.
      const rec=steps.find(s=>!s.completed&&s.dueDate);
      b.items.push({type:'project',id:p.id,name:p.name,projectName:null,endDate:null,
        stepName:cur?cur.name:null,date:rec?rec.dueDate:null,completed:!cur,
        stepsDone:done,stepsTotal:steps.length,
        record:rec?{kind:'step',id:rec.id}:null});
    });
    state.manualEvents.forEach(m=>{
      const b=bucket(m.vendorId),p=project(state,m.projectId);
      b.items.push({type:'manual',id:m.id,name:m.name,projectName:p?p.name:null,endDate:m.endDate||null,
        stepName:null,date:m.date||null,completed:!!m.completed,
        stepsDone:0,stepsTotal:0,record:{kind:'manual',id:m.id}});
    });
    eventRecords(state).filter(e=>!e.completed&&e.date).forEach(e=>{
      const b=byVendor.get(e.vendorId||'');if(!b)return;
      if(phaseOf(e)==='after')b.overdueCount++;              // 기간 건은 종료일이 지나야 지연이다
      if(!b.next||sortDate(e)<sortDate(b.next))b.next=e;
    });
    // 업체별로 얼마가 나갔는지는 업체 화면에서 바로 답해야 한다.
    (state.spends||[]).forEach(sp=>{
      const b=bucket(sp.vendorId),amt=money(sp.amount);

      spentRate:amount?Math.min(100,spent/amount*100):0,

    // 총계는 예산항목에 붙지 않은 지출까지 센다. 숨기면 총계가 거짓말이 된다.

  /** 이 일정·절차에 걸린 지출. 상세 모달이 쓴다. */
  function spendsOfRecord(state,kind,id){return (state.spends||[]).filter(sp=>sp.recordKind===kind&&sp.recordId===id)}
  /** 행사별 요약. 업체별·예산과 같은 모양으로 만들어 화면이 합계를 들고 있지 않게 한다. */
  function groupSummaries(state){

    // '진행중'은 지금 벌어지고 있는 일이므로 '오늘' 자리에 놓는다. 글자가 달라 구분된다.

   $('qName').placeholder=L.fEventName;
   $('qName').setAttribute('aria-label',L.fEventName);
   $('qDate').setAttribute('aria-label',`${state.terms.event} 시작일`);
   $('qEnd').setAttribute('aria-label',`${state.terms.event} ${L.fEndDate}`);
   $('qEnd').title=L.fEndDate;
   $('qVendor').setAttribute('aria-label',L.fVendor);
   $('qVendor').innerHTML=`<option value="">${C.esc(L.noVendor)}</option>`+
     state.vendorTemplates.map(v=>`<option value="${C.esc(v.id)}">${C.esc(v.name)}</option>`).join('');
 }
 function openQuick(){fillQuick();$('qMsg').textContent='';$('qName').value='';$('qDate').value=C.todayISO();$('qEnd').value='';quick.hidden=false;$('helperQuick').setAttribute('aria-expanded','true');$('qName').focus()}
 function closeQuick(){quick.hidden=true;$('helperQuick').setAttribute('aria-expanded','false')}
 $('helperQuick').addEventListener('click',()=>{quick.hidden?openQuick():closeQuick()});
 $('qCancel').addEventListener('click',closeQuick);
 quick.addEventListener('submit',async e=>{
   e.preventDefault();
   const name=$('qName').value.trim(),date=$('qDate').value,endDate=$('qEnd').value||null;
   if(!name||!date){$('qMsg').textContent=`${L.fEventName}과 날짜를 확인하세요.`;return}
   if(endDate&&endDate<date){$('qMsg').textContent=L.badEndDate;return}
   state.manualEvents.push({id:C.uid('m'),vendorId:$('qVendor').value||null,projectId:null,date,endDate,name,memo:'',completed:false,completedAt:null,logs:[],attachments:[]});
   await C.saveState(state);
   closeQuick();render();
 });
 // 폼이 열려 있을 때 Escape 는 도우미를 치우는 게 아니라 폼만 닫는다.
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!quick.hidden){e.preventDefault();closeQuick()}});

 $('helperHide').addEventListener('click',async()=>{if(C.isTauri())await invoke('hide_helper');else window.close()});$('helperOpenMain').addEventListener('click',openMain);await C.watchState(v=>{state=v;render();if(!quick.hidden)fillQuick()});render();
})();

</script></body></html>
