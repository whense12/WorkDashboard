name: Build

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '실동작 E2E 를 함께 돌린다 (GitHub 러너에서는 현재 실패한다 — 아래 주석 참고)'
        type: boolean
        default: false
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # 프론트엔드 검증은 리눅스에서 돌린다. Windows 러너는 느리고 비싸므로
  # Tauri 네이티브 빌드에만 쓴다.
  web:
    name: 프론트엔드 검증
    runs-on: ubuntu-latest
    # 러너가 먹통이 되면 6시간 기본값까지 매달려 있는다. 정상값의 몇 배에서 끊는다.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: JavaScript 구문 검사
        run: npm run check

      - name: 단독 실행 HTML 드리프트 검사
        # web_standalone.html / helper_preview.html 은 frontend/ 에서 생성된 결과물이다.
        # 손으로 고쳐 원본과 어긋나면 여기서 잡는다.
        run: |
          npm run build:standalone
          git diff --exit-code -- web_standalone.html helper_preview.html \
            || { echo "::error::생성물이 frontend/ 와 어긋납니다. npm run build:standalone 후 커밋하세요."; exit 1; }

      - name: 브라우저 스모크 테스트
        run: |
          npx playwright install --with-deps chromium
          npm test

  windows:
    name: Windows NSIS 설치파일
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: 의존성 설치
        # cargo install tauri-cli 는 매 실행마다 소스에서 컴파일해 10분 넘게 걸린다.
        # npm 배포판(@tauri-apps/cli)은 미리 빌드된 바이너리를 받는다.
        run: npm ci

      - name: NSIS 설치파일 빌드
        run: npx tauri build --bundles nsis

      - name: 콘솔 창이 딸려 뜨지 않는지 검사
        shell: pwsh
        run: |
          # main.rs 의 windows_subsystem 속성이 빠지면 릴리스 빌드도 콘솔 서브시스템으로
          # 링크되어, 앱 옆에 검은 콘솔 창이 앱이 살아 있는 내내 남는다.
          # 빌드는 성공하므로 "빌드 초록불"만 봐서는 절대 잡히지 않는다. 실물 exe 의
          # PE 헤더를 직접 읽는다. 새 의존성 없이 바이트만 읽으면 된다.
          #   0x3C            -> PE 헤더 오프셋 (4바이트 LE)
          #   PE + 0x5C       -> Optional Header 의 Subsystem (2바이트 LE)
          #   2 = WINDOWS_GUI, 3 = WINDOWS_CUI(콘솔)
          $exe = Get-ChildItem src-tauri/target/release -Filter '*.exe' -File |
                 Where-Object { $_.Name -like 'work?calendar?helper.exe' } |
                 Select-Object -First 1
          if (-not $exe) { throw "빌드된 실행파일을 찾지 못했습니다." }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          Write-Host "$($exe.Name) subsystem = $subsystem"
          if ($subsystem -ne 2) {
            Write-Host "::error::$($exe.Name) 가 콘솔 서브시스템($subsystem)으로 빌드되었습니다. 실행하면 검은 콘솔 창이 함께 뜹니다. src-tauri/src/main.rs 의 #![cfg_attr(not(debug_assertions), windows_subsystem = `"windows`")] 속성을 확인하세요."
            exit 1
          }
          Write-Host "GUI 서브시스템 확인 — 콘솔 창이 뜨지 않습니다."

      - name: 릴리스노트 생성
        shell: bash
        run: |
          mkdir -p dist-notes
          {
            echo "업체별 업무 일정 · D-day 도우미"
            echo "커밋 ${GITHUB_SHA::7} · 빌드 $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "[설치]"
            echo "  받은 .exe 를 그대로 실행하면 됩니다."
            echo "  관리자 권한(UAC)이 필요 없습니다 — 현재 사용자 폴더에만 설치됩니다."
            echo "  WebView2 가 없는 PC 를 위해 부트스트래퍼를 설치파일에 담았습니다."
            echo
            echo "[도우미는 창이 아니라 바탕화면 악세사리입니다]"
            echo "  제목표시줄이 없고 작업표시줄에도 뜨지 않습니다."
            echo "  카드나 버튼이 아닌 바탕 아무 데나 잡아서 끌면 움직이고, 그 자리를 기억합니다."
            echo "  + 를 누르면 이름·날짜·업체만으로 일정을 바로 적을 수 있습니다."
            echo "  x 는 악세사리를 치웁니다. 대시보드까지 닫혀 있었다면 앱이 끝납니다."
            echo "  대시보드 창을 닫아도 앱은 끝나지 않고 도우미가 바탕화면에 남습니다."
            echo
            echo "[일정에 기간을 줄 수 있습니다]"
            echo "  일정 추가에서 종료일을 넣으면 행사참여기간 같은 기간이 됩니다."
            echo "  캘린더에 이어진 띠로 보이고, 기간 중에는 D-day 대신 '진행중'으로 바뀝니다."
            echo "  업무 추가에서 행사 전체 기간도 줄 수 있습니다."
            echo
            echo "[업체를 고르는 칸이 검색됩니다]"
            echo "  업체·행사·예산항목 칸은 글자를 치면 걸러집니다."
            echo "  목록에 없으면 맨 아래 '○○ 새 업체로 만들기' 가 나옵니다. 다른 화면으로 나갈 일이 없습니다."
            echo "  위아래 화살표와 Enter 로 마우스 없이 끝납니다."
            echo
            echo "[행사에 여러 업체를 붙입니다]"
            echo "  업무 추가에서 '행사' 를 고르거나 새로 만들면 그 행사의 참여 건이 됩니다."
            echo "  중간에 업체가 더 들어오면 [행사별] 화면에서 그 행사를 펼치고 '+ 참여 업체 추가'."
            echo "  업체마다 참여기간을 다르게 둘 수 있습니다 - A/B 는 한 달, C 는 2주 같은 경우."
            echo "  캘린더 띠는 참여 업체가 몇 곳이든 한 줄입니다."
            echo
            echo "[여러 업체에 같은 일정을 한 번에]"
            echo "  일정 추가에서 업체를 여러 곳 고르면 업체 수만큼 일정이 따로 만들어집니다."
            echo "  '업체별로 다르게' 에서 한 줄만 고치면 그 업체만 기간이 달라집니다."
            echo "  만들어진 뒤에는 완료/기록/첨부/삭제가 전부 따로 됩니다."
            echo
            echo "[지울 때는 물어보지 않고 되돌리기를 줍니다]"
            echo "  지우면 먼저 지우고 '되돌리기' 가 6.5초 뜹니다."
            echo "  첨부 실물은 되돌리기가 사라진 뒤에 지웁니다."
            echo
            echo "[예산]"
            echo "  대시보드 오른쪽 위 [캘린더 | 업체별 | 예산] 에서 예산을 고르세요."
            echo "  합본예산서 버튼으로 예산항목과 예산액을 넣고, 지출을 등록하면"
            echo "  예산항목 > 행사 > 업체 순으로 펼쳐 보며 어디에 얼마가 나갔는지 확인합니다."
            echo "  지출은 일정 상세에서도 바로 등록할 수 있습니다."
            echo "  * 합본예산서를 파일에서 가져오는 기능은 아직 없습니다. 손입력입니다."
            echo
            echo "[처음 켰을 때]"
            echo "  업체·업무 템플릿만 들어 있고 예시 공사는 비어 있습니다."
            echo "  둘러보려면 설정 > 예시 데이터 불러오기 를 누르세요."
            echo
            echo "[데이터가 어디 있나]"
            echo "  %LOCALAPPDATA%\\kr.go.goseong.work-calendar-helper"
            echo "    attachments\\  첨부파일 실물"
            echo "    backups\\      하루 한 번 자동으로 만들어지는 백업(최근 7개)"
            echo "  설정 > 백업 > 폴더 열기 로 바로 갈 수 있습니다."
            echo
            echo "[다른 업무에 쓰려면]"
            echo "  템플릿 > 용어·항목 에서 '업체/업무/절차/일정' 이름과"
            echo "  업체 항목을 바꿀 수 있습니다. 기존 데이터는 그대로 유지됩니다."
          } > dist-notes/릴리스노트.txt
          cp src-tauri/target/release/bundle/nsis/*.exe dist-notes/

      - name: 설치파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: work-calendar-helper-windows-x64
          path: dist-notes/*
          if-no-files-found: error

      - name: 실행파일을 E2E 로 넘기기
        # E2E 잡이 같은 걸 다시 컴파일하면 20분이 그냥 날아간다.
        # tauri CLI 가 mainBinaryName 으로 리네임하는지에 기대지 않고 두 이름을 모두 받는다.
        uses: actions/upload-artifact@v4
        with:
          name: app-exe
          path: |
            src-tauri/target/release/work-calendar-helper.exe
            src-tauri/target/release/work_calendar_helper.exe
          retention-days: 1
          if-no-files-found: error

  # 빌드된 실물 앱을 띄워 조작하는 검사.
  #
  # 현재 GitHub 의 windows-latest 러너에서는 성립하지 않는다. 세션 생성이 언제나
  # "DevToolsActivePort file doesn't exist" 로 실패한다 — 러너의 비대화형 세션에서는
  # GUI 앱의 WebView2 가 디버깅 포트를 열지 못한다. msedgedriver 를 WebView2 런타임
  # 버전에 맞추고 3회 재시도해도 같았다.
  #
  # 그래서 기본 실행에서 빼 두고 수동 실행 입력으로만 켠다. 스크립트(tests/e2e.mjs)는
  # 그대로 둔다 — 실제 Windows PC 나 대화형 세션을 쓰는 러너에서는 npm run test:e2e 로
  # 그대로 돌아간다. 자동 검사가 못 하는 항목은 README 에 확인 필요로 적어 두었다.
  windows-e2e:
    name: Windows 실동작 E2E (수동)
    timeout-minutes: 40
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e }}
    runs-on: windows-latest
    needs: windows
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 의존성 설치
        run: npm ci

      - name: 빌드된 실행파일 내려받기
        uses: actions/download-artifact@v4
        with:
          name: app-exe
          path: src-tauri/target/release

      - name: Edge WebDriver 맞추기
        shell: pwsh
        run: |
          # tauri-driver 는 앱의 WebView2 를 msedgedriver 로 붙잡는다.
          # 맞춰야 하는 것은 Edge 브라우저 버전이 아니라 **WebView2 런타임** 버전이다.
          # 어긋나면 세션 생성이 "DevToolsActivePort file doesn't exist" 로 실패한다.
          $clientKey = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = $null
          foreach ($root in @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients',
                              'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients',
                              'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients')) {
            $p = Join-Path $root $clientKey
            if (Test-Path $p) { $v = (Get-ItemProperty $p -Name pv -ErrorAction SilentlyContinue).pv; if ($v) { break } }
          }
          if (-not $v) {
            Write-Host "레지스트리에서 WebView2 런타임 버전을 찾지 못했습니다. 설치 폴더에서 찾습니다."
            $d = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match '^\d+\.' } | Sort-Object Name -Descending | Select-Object -First 1
            if ($d) { $v = $d.Name }
          }
          if (-not $v) { $v = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          Write-Host "WebView2 런타임 버전: $v"

          $dest = "$env:RUNNER_TEMP\edgedriver"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $ok = $false
          foreach ($try in @($v, ($v -replace '\.\d+$', '.0'))) {
            try {
              Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$try/edgedriver_win64.zip" -OutFile edgedriver.zip -UseBasicParsing
              Expand-Archive edgedriver.zip -DestinationPath $dest -Force
              Write-Host "msedgedriver $try 내려받음"; $ok = $true; break
            } catch { Write-Host "msedgedriver $try 없음" }
          }
          if (-not $ok) {
            $pre = Get-ChildItem -Path 'C:\SeleniumWebDrivers\EdgeDriver' -Filter msedgedriver.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $pre) { throw "msedgedriver 를 찾을 수 없습니다." }
            Copy-Item $pre.FullName $dest -Force
            Write-Host "러너에 설치된 드라이버로 대체합니다."
          }
          & "$dest\msedgedriver.exe" --version
          echo $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: tauri-driver 설치
        run: cargo install tauri-driver --locked

      - name: 실동작 E2E
        run: node tests/e2e.mjs
