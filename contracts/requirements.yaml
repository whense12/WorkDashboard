    verify_citation_note: "Same off-by-one: item 12 is AGENTS.md:37, not AGENTS.md:38. The quoted fragment \"work/procedure templates must be user-editable\" is a verbatim substring of that line, but it silently drops the first half (\"Vendor templates/master data and ...\")."

