# contracts/requirements.yaml
#
# 이 저장소의 제품 요구사항 레지스터.
# 원문(authoritative)은 AGENTS.md · CODEX_IMPLEMENTATION_BRIEF.md · CODEX_START_PROMPT.txt 이며,
# 이 파일은 그 원문에서 기계적으로 추출한 색인이다. 충돌하면 원문이 이긴다.
#
# 이 파일은 protected 다 (CLAUDE.md §6). Claude 는 임의 수정하지 않는다.
#
# status 어휘
#   APPROVED    계약이 구속력 있게 진술함 (must / required / non-negotiable / do not / acceptance criterion)
#   PROVISIONAL 계약 자체가 완화해서 진술함 (suggested / recommended / prefer / may / example / 제안된 기본값)
#   REJECTED    계약이 명시적으로 금지·제외함 (§2 rejected directions / §27 out of scope / AGENTS.md:22)
#   UNKNOWN     계약이 침묵하거나 모호하거나 스스로 모순됨 — 결정되지 않음
#
# 규칙: Claude 는 자체 판단으로 APPROVED 를 만들지 않는다.
#       UNKNOWN 과 PROVISIONAL 의 승격은 orchestrator/user 승인 사항이다.
#       "이미 구현되어 있다"는 것은 APPROVED 의 근거가 되지 않는다.

