  - id: PRC-89
    title: "Codex decision rule — choose clarity and fewer interactions"
    status: APPROVED
    category: process
    source: "CODEX_IMPLEMENTATION_BRIEF.md:1273-1279"
    quote: "If you have to choose between:\n\n- showing more information vs. keeping the main calendar easy to scan,\n- adding another control vs. making the existing interaction direct,\n- introducing a new status model vs. using date/task context already present,\n\nchoose **clarity and fewer interactions**."
    status_reason: "Imperative \"choose\", emphasised in bold, governing all three named trade-offs. AGENTS.md numbered UI contract item 15 restates it: \"Prefer fewer controls, stable placement, and progressive disclosure over feature visibility.\" (AGENTS.md:40) — AGENTS.md's wording is \"Prefer\", the brief's is a flat instruction."

  - id: PRC-90
    title: "Ask before inventing on ambiguity"
    status: APPROVED
    category: process
    source: "CODEX_IMPLEMENTATION_BRIEF.md:1281"
    quote: "If a requirement is genuinely ambiguous and the decision would add visible UI or change user data semantics, **ask before inventing**."
    status_reason: "Bold imperative \"ask before inventing\", gated on two cumulative conditions (genuine ambiguity AND visible-UI/data-semantics impact). AGENTS.md \"If product ambiguity remains\" restates it: \"Do not add speculative UI. Ask a focused question or preserve the simpler behavior.\" (AGENTS.md:98-100) — AGENTS.md permits an alternative to asking; see internal_conflicts. CODEX_START_PROMPT.txt:13 repeats: \"If a requirement is ambiguous enough to change visible UI or data semantics, ask instead of inventing another feature.\""

