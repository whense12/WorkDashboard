<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업체별 업무 일정 v5</title><link rel="stylesheet" href="styles.css"></head><body>
<svg class="sprite" aria-hidden="true"><!-- Lucide (ISC License) https://lucide.dev — 사용하는 아이콘만 추출 --><symbol id="i-calendar-days" viewBox="0 0 24 24"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /><path d="M8 13h.01" /><path d="M12 13h.01" /><path d="M16 13h.01" /><path d="M8 17h.01" /><path d="M12 17h.01" /><path d="M16 17h.01" /></symbol><symbol id="i-app-window" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M10 4v4" /><path d="M2 8h20" /><path d="M6 4v4" /></symbol><symbol id="i-layout-template" viewBox="0 0 24 24"><rect width="18" height="7" x="3" y="3" rx="1" /><rect width="9" height="7" x="3" y="14" rx="1" /><rect width="5" height="7" x="16" y="14" rx="1" /></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></symbol><symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M12 10v6" /><path d="M9 13h6" /><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></symbol><symbol id="i-calendar-plus" viewBox="0 0 24 24"><path d="M16 18h6" /><path d="M16 2v3" /><path d="M19 15v6" /><path d="M21 11.5V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h8.3" /><path d="M3 9h18" /><path d="M8 2v3" /></symbol><symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol><symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol></svg>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brandmark"><svg class="ico" aria-hidden="true"><use href="#i-calendar-days"/></svg></div><h1 data-t="app"></h1></div>
  <div class="top-actions">
    <button class="btn" id="helperBtn"><svg class="ico" aria-hidden="true"><use href="#i-app-window"/></svg><span class="label">D-day 도우미</span></button>
    <button class="btn" id="templateBtn"><svg class="ico" aria-hidden="true"><use href="#i-layout-template"/></svg><span class="label">템플릿</span></button>
    <button class="btn" id="settingsBtn"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg><span class="label">설정</span></button>
    <button class="btn" id="addWorkBtn"><svg class="ico" aria-hidden="true"><use href="#i-folder-plus"/></svg><span class="label" data-t="addProject"></span></button>
    <button class="btn primary" id="addScheduleBtn"><svg class="ico" aria-hidden="true"><use href="#i-calendar-plus"/></svg><span class="label" data-t="addEvent"></span></button>
  </div>
</header>
<main class="workspace">
  <aside class="panel sidebar">
    <div class="side-head"><div class="side-row"><div class="side-title" data-t="upcoming"></div><div class="horizon">기준 <select id="horizonSelect"><option value="3">D-3</option><option value="5">D-5</option><option value="7">D-7</option><option value="14">D-14</option><option value="30">D-30</option><option value="all">무제한</option><option value="custom">직접설정</option></select><input id="horizonCustom" type="number" min="1" max="3650" class="hidden" aria-label="직접 D-day 일수"></div></div><div class="side-caption" data-t="sideCaption"></div></div>
    <div class="due-list" id="dueList"></div>
  </aside>
  <section class="panel calendar-panel">
    <div class="cal-toolbar"><div class="tabs seg" role="tablist" aria-label="대시보드 보기"><button class="tab active" role="tab" data-board="calendar" data-t="viewCalendar"></button><button class="tab" role="tab" data-board="vendor" data-t="viewVendor"></button></div><div class="cal-nav" id="calNav"><button class="btn icon" id="prevMonth" aria-label="이전 달"><svg class="ico" aria-hidden="true"><use href="#i-chevron-left"/></svg></button><div class="month-title" id="monthTitle"></div><button class="btn icon" id="nextMonth" aria-label="다음 달"><svg class="ico" aria-hidden="true"><use href="#i-chevron-right"/></svg></button><button class="btn" id="todayBtn">Today</button></div><div class="cal-spacer"></div><span class="hint" id="calHint"></span></div>
    <div class="calendar-scroll" id="calendarScroll"><div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="month-grid" id="monthGrid"></div></div>
    <div class="vendor-board hidden" id="vendorBoard"></div>
  </section>
</main></div>

<div class="modal-bg" id="scheduleModal"><section class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="scheduleTitle"><div class="modal-head"><h2 id="scheduleTitle" data-t="eventModalTitle"></h2><button class="close" data-close="scheduleModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body"><div class="form-grid">
  <div class="field"><label for="sDate" data-t="fStartDate"></label><input id="sDate" type="date"></div><div class="field"><label for="sEnd" data-t="fEndDate"></label><input id="sEnd" type="date"></div>
  <div class="field full"><label for="sVendor" data-t="fVendor"></label><select id="sVendor"></select></div>
  <div class="field full"><label for="sProject" data-t="fLinkedProject"></label><select id="sProject"></select><div class="field-note" data-t="fLinkedNote"></div></div>
  <div class="field full"><label for="sName" data-t="fEventName"></label><input id="sName" placeholder="예: 현장확인, 서류제출, 계약의뢰…"></div>
  <div class="field full"><label for="sMemo">메모</label><textarea id="sMemo" placeholder="필요한 내용만 간단히 기록"></textarea></div>
</div></div><div class="modal-foot"><button class="btn" data-close="scheduleModal">취소</button><button class="btn primary" id="saveScheduleBtn" data-t="saveEvent"></button></div></section></div>

<div class="modal-bg" id="workModal"><section class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="workTitle"><div class="modal-head"><h2 id="workTitle" data-t="projectModalTitle"></h2><button class="close" data-close="workModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body"><div class="form-grid">
  <div class="field"><label for="wVendor" data-t="fVendor"></label><select id="wVendor"></select></div><div class="field"><label for="wTemplate" data-t="fWorkTemplate"></label><select id="wTemplate"></select></div>
  <div class="field full hidden" id="wNewVendorBox"><label for="wNewVendorName" data-t="vendorName"></label><input id="wNewVendorName" autocomplete="off"><div class="form-grid" id="wNewVendorFields" style="margin-top:9px"></div></div>
  <div class="field full" id="wProjectBox"><label for="wProject" data-t="fProjectName"></label><input id="wProject" placeholder="예: ○○배수로 정비공사"></div>
  <div class="field" id="wFirstDateBox"><label for="wFirstDate" data-t="fFirstDate"></label><input id="wFirstDate" type="date"></div><div class="field"><label for="wMemo">메모</label><input id="wMemo" placeholder="선택"></div>
  <div class="field full" id="wPeriodBox"><span class="label" data-t="fProjectPeriod"></span><div class="ev-row two"><input id="wStart" type="date" aria-label="시작일"><input id="wEnd" type="date" aria-label="종료일"></div></div>
  <div class="field full"><span class="label" id="wEventsLabel"></span><div class="ev-list" id="wEvents"></div><button class="btn" id="wAddEvent" style="margin-top:7px"></button><div class="field-note" id="wEventsHint"></div></div>
</div></div><div class="modal-foot"><button class="btn" data-close="workModal">취소</button><button class="btn primary" id="saveWorkBtn">등록</button></div></section></div>

<div class="modal-bg" id="detailModal"><section class="modal detail-modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-head"><h2 id="detailTitle" data-t="detailTitle"></h2><button class="close" data-close="detailModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body" id="detailBody"></div><div class="modal-foot"><button class="btn danger hidden" id="deleteEventBtn" data-t="deleteEvent"></button><button class="btn hidden" id="reopenBtn">완료 취소</button><button class="btn" id="changeDateBtn">날짜 변경</button><button class="btn primary" id="completeBtn">OK 완료</button></div></section></div>

<div class="modal-bg" id="dateModal"><section class="modal narrow" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dateTitle"><div class="modal-head"><h2 id="dateTitle">날짜 변경</h2><button class="close" data-close="dateModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body"><div class="form-grid"><div class="field"><label for="dNewDate">새 시작일</label><input id="dNewDate" type="date"></div><div class="field"><label for="dNewEnd" data-t="fNewEndDate"></label><input id="dNewEnd" type="date"></div></div><div class="field-note" id="dateModalNote"></div></div><div class="modal-foot"><button class="btn" data-close="dateModal">취소</button><button class="btn primary" id="saveDateBtn">날짜 저장</button></div></section></div>

<div class="modal-bg" id="templateModal"><section class="modal wide" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="templateTitle"><div class="modal-head"><h2 id="templateTitle">템플릿 관리</h2><button class="close" data-close="templateModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body"><div class="tabs"><button class="tab active" data-template-tab="vendor" data-t="fVendorTemplate"></button><button class="tab" data-template-tab="work" data-t="fWorkTemplate"></button><button class="tab" data-template-tab="terms">용어·항목</button></div><div id="vendorTemplatePane"></div><div id="workTemplatePane" class="hidden"></div><div id="termsPane" class="hidden"></div></div><div class="modal-foot"><button class="btn" data-close="templateModal">닫기</button></div></section></div>

<div class="modal-bg" id="projectStepsModal"><section class="modal wide" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="projectStepsTitle"><div class="modal-head"><h2 id="projectStepsTitle">업무 절차 편집</h2><button class="close" data-close="projectStepsModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body"><div class="proc-list" id="projectStepsList"></div><button class="btn" id="projectAddStep" style="margin-top:8px" data-t="addStep"></button></div><div class="modal-foot"><button class="btn" data-close="projectStepsModal">취소</button><button class="btn primary" id="saveProjectSteps" data-t="saveSteps"></button></div></section></div>

<div class="modal-bg" id="settingsModal"><section class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal-head"><h2 id="settingsTitle">도우미 설정</h2><button class="close" data-close="settingsModal" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div><div class="modal-body">
  <div class="setting-row"><div class="setting-copy"><b>D-day 도우미 표시</b><span>작은 창으로 업체별 가까운 일정을 띄웁니다.</span></div><button class="btn" id="settingsOpenHelper">도우미 열기</button></div>
  <div class="setting-row"><div class="setting-copy"><b>항상 위에 표시</b><span>데스크톱 앱에서 다른 창 위에 유지합니다.</span></div><label class="switch"><input id="alwaysOnTop" type="checkbox"><span class="slider"></span></label></div>
  <div class="setting-row"><div class="setting-copy"><b>컴퓨터 시작 시 자동 실행</b><span>Tauri 데스크톱 앱에서 지원됩니다.</span></div><label class="switch"><input id="autostart" type="checkbox"><span class="slider"></span></label></div>
  <div class="setting-row"><div class="setting-copy"><b>백업</b><span id="backupCopy"></span></div><div class="setting-actions"><button class="btn" id="backupNowBtn">지금 백업</button><button class="btn hidden" id="backupFolderBtn">폴더 열기</button></div></div>
  <div class="setting-row"><div class="setting-copy"><b>백업에서 복원</b><span>복원 직전 현재 데이터를 한 벌 자동으로 남깁니다.</span></div><div class="setting-actions"><select id="backupPick" class="hidden" aria-label="복원할 백업 선택"></select><button class="btn hidden" id="restoreBtn">복원</button><label class="btn hidden" for="restoreFile" id="restoreFileLabel">백업 파일 선택</label><input id="restoreFile" type="file" accept=".zip,application/zip" hidden></div></div>
  <div class="setting-row"><div class="setting-copy"><b>예시 데이터</b><span id="demoCopy" data-t="demoCopy"></span></div><button class="btn" id="demoToggleBtn">예시 데이터 불러오기</button></div>
</div><div class="modal-foot"><button class="btn" data-close="settingsModal">닫기</button></div></section></div>
<div class="toast" id="toast"></div>
<script src="zip.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
