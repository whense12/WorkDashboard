[package]
name = "spike-shell-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Spike A - Windows desktop shell behaviour probe (Tauri 2)"
publish = false

[lib]
name = "spike_shell_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-autostart = "=2.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  # added for the message-hook shell layer (src/win_shell.rs):
  #   SetWindowSubclass / RemoveWindowSubclass / DefSubclassProc live in Win32_UI_Shell
  "Win32_UI_Shell",
  # added for the monitor-normalized placement experiment (src/monitor_placement.rs):
  #   MonitorFromWindow / GetMonitorInfoW / EnumDisplayMonitors / MONITORINFOEXW
  "Win32_Graphics_Gdi",
  #   GetDpiForMonitor / GetDpiForWindow
  "Win32_UI_HiDpi",
  # added for the headless Win32 probe (src/win32_probe.rs):
  #   GetModuleHandleW / GetModuleFileNameW, used to create the hidden probe window and to
  #   report which comctl32 the activation context actually resolved to
  "Win32_System_LibraryLoader",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
