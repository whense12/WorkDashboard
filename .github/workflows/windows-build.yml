name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # 프론트엔드 검증은 리눅스에서 돌린다. Windows 러너는 느리고 비싸므로
  # Tauri 네이티브 빌드에만 쓴다.
  web:
    name: 프론트엔드 검증
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: JavaScript 구문 검사
        run: npm run check

      - name: 단독 실행 HTML 드리프트 검사
        # web_standalone.html / helper_preview.html 은 frontend/ 에서 생성된 결과물이다.
        # 손으로 고쳐 원본과 어긋나면 여기서 잡는다.
        run: |
          npm run build:standalone
          git diff --exit-code -- web_standalone.html helper_preview.html \
            || { echo "::error::생성물이 frontend/ 와 어긋납니다. npm run build:standalone 후 커밋하세요."; exit 1; }

      - name: 브라우저 스모크 테스트
        run: |
          npx playwright install --with-deps chromium
          npm test

  windows:
    name: Windows NSIS 설치파일
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: 의존성 설치
        # cargo install tauri-cli 는 매 실행마다 소스에서 컴파일해 10분 넘게 걸린다.
        # npm 배포판(@tauri-apps/cli)은 미리 빌드된 바이너리를 받는다.
        run: npm ci

      - name: NSIS 설치파일 빌드
        run: npx tauri build --bundles nsis

      - name: 릴리스노트 생성
        shell: bash
        run: |
          mkdir -p dist-notes
          {
            echo "업체별 업무 일정 · D-day 도우미"
            echo "커밋 ${GITHUB_SHA::7} · 빌드 $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "[설치]"
            echo "  받은 .exe 를 그대로 실행하면 됩니다."
            echo "  관리자 권한(UAC)이 필요 없습니다 — 현재 사용자 폴더에만 설치됩니다."
            echo "  WebView2 가 없는 PC 를 위해 부트스트래퍼를 설치파일에 담았습니다."
            echo
            echo "[처음 켰을 때]"
            echo "  업체·업무 템플릿만 들어 있고 예시 공사는 비어 있습니다."
            echo "  둘러보려면 설정 > 예시 데이터 불러오기 를 누르세요."
            echo
            echo "[데이터가 어디 있나]"
            echo "  %LOCALAPPDATA%\\kr.go.goseong.work-calendar-helper"
            echo "    attachments\\  첨부파일 실물"
            echo "    backups\\      하루 한 번 자동으로 만들어지는 백업(최근 7개)"
            echo "  설정 > 백업 > 폴더 열기 로 바로 갈 수 있습니다."
            echo
            echo "[다른 업무에 쓰려면]"
            echo "  템플릿 > 용어·항목 에서 '업체/업무/절차/일정' 이름과"
            echo "  업체 항목을 바꿀 수 있습니다. 기존 데이터는 그대로 유지됩니다."
          } > dist-notes/릴리스노트.txt
          cp src-tauri/target/release/bundle/nsis/*.exe dist-notes/

      - name: 설치파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: work-calendar-helper-windows-x64
          path: dist-notes/*
          if-no-files-found: error

      - name: 실행파일을 E2E 로 넘기기
        # E2E 잡이 같은 걸 다시 컴파일하면 20분이 그냥 날아간다.
        # tauri CLI 가 mainBinaryName 으로 리네임하는지에 기대지 않고 두 이름을 모두 받는다.
        uses: actions/upload-artifact@v4
        with:
          name: app-exe
          path: |
            src-tauri/target/release/work-calendar-helper.exe
            src-tauri/target/release/work_calendar_helper.exe
          retention-days: 1
          if-no-files-found: error

  # 빌드된 실물 앱을 띄워 조작한다. 브라우저 스모크로는 확인할 수 없는 것들 —
  # 앱 폴더에 파일이 실제로 생기는가, 재시작 후에도 남는가, 자동 실행이 레지스트리에
  # 들어가는가, 도우미가 항상 위에 오는가, 창 위치가 복원되는가, 실제 WebView2 에서
  # CSP 가 화면을 깨뜨리지 않는가 — 를 여기서 확인한다.
  windows-e2e:
    name: Windows 실동작 E2E
    runs-on: windows-latest
    needs: windows
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 의존성 설치
        run: npm ci

      - name: 빌드된 실행파일 내려받기
        uses: actions/download-artifact@v4
        with:
          name: app-exe
          path: src-tauri/target/release

      - name: Edge WebDriver 맞추기
        shell: pwsh
        run: |
          # tauri-driver 는 앱의 WebView2 를 msedgedriver 로 붙잡는다.
          # 맞춰야 하는 것은 Edge 브라우저 버전이 아니라 **WebView2 런타임** 버전이다.
          # 어긋나면 세션 생성이 "DevToolsActivePort file doesn't exist" 로 실패한다.
          $clientKey = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = $null
          foreach ($root in @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients',
                              'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients',
                              'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients')) {
            $p = Join-Path $root $clientKey
            if (Test-Path $p) { $v = (Get-ItemProperty $p -Name pv -ErrorAction SilentlyContinue).pv; if ($v) { break } }
          }
          if (-not $v) {
            Write-Host "레지스트리에서 WebView2 런타임 버전을 찾지 못했습니다. 설치 폴더에서 찾습니다."
            $d = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match '^\d+\.' } | Sort-Object Name -Descending | Select-Object -First 1
            if ($d) { $v = $d.Name }
          }
          if (-not $v) { $v = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          Write-Host "WebView2 런타임 버전: $v"

          $dest = "$env:RUNNER_TEMP\edgedriver"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $ok = $false
          foreach ($try in @($v, ($v -replace '\.\d+$', '.0'))) {
            try {
              Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$try/edgedriver_win64.zip" -OutFile edgedriver.zip -UseBasicParsing
              Expand-Archive edgedriver.zip -DestinationPath $dest -Force
              Write-Host "msedgedriver $try 내려받음"; $ok = $true; break
            } catch { Write-Host "msedgedriver $try 없음" }
          }
          if (-not $ok) {
            $pre = Get-ChildItem -Path 'C:\SeleniumWebDrivers\EdgeDriver' -Filter msedgedriver.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $pre) { throw "msedgedriver 를 찾을 수 없습니다." }
            Copy-Item $pre.FullName $dest -Force
            Write-Host "러너에 설치된 드라이버로 대체합니다."
          }
          & "$dest\msedgedriver.exe" --version
          echo $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: tauri-driver 설치
        run: cargo install tauri-driver --locked

      - name: 실동작 E2E
        run: node tests/e2e.mjs
