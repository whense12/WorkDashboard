[package]
name = "work_calendar_helper"
version = "0.5.0"
description = "업체별 업무 일정 및 D-day 도우미"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "work_calendar_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
# 바탕화면 아이콘 뒤(배경화면 계층)에 조각을 심기 위한 Win32 호출
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
