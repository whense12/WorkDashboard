    status_reason: "Out-of-scope item 15 of 15. AGENTS.md item 2 forbids \"other invented management states\" including \"external waiting\", \"within 7 days\" (AGENTS.md:22); §30 third bullet (line 1277) also disfavors \"introducing a new status model\"."

