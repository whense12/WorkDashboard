requirements:

  # ===== BRIEF §0-§4  (framing, domain, rejected directions, core concept, glanceability) =====
  - id: CORE-01
    title: "Brief is a zero-context handoff specification"
    status: APPROVED
    category: process
    source: "CODEX_IMPLEMENTATION_BRIEF.md:3"
    quote: "**Document purpose:** handoff specification for a Codex agent with zero prior conversation context"
    status_reason: "\"handoff specification\" — and §0's heading (line 11) calls it a contract. Hardened by AGENTS.md:5 (\"read `CODEX_IMPLEMENTATION_BRIEF.md` in full`\", bold \"read ... in full\") and CODEX_START_PROMPT.txt:3 (\"Read both completely before editing code\")."
    verify_citation_note: "Primary quote (brief:3) is byte-exact. The status_reason misrenders AGENTS.md:5 as: read `CODEX_IMPLEMENTATION_BRIEF.md` in full` — the source reads: **read `CODEX_IMPLEMENTATION_BRIEF.md` in full**. The closing bold markers were replaced by a stray backtick."

  - id: CORE-02
    title: "Target: Windows-first Tauri 2 desktop + standalone web preview"
    status: APPROVED
    category: platform
    source: "CODEX_IMPLEMENTATION_BRIEF.md:4"
    quote: "**Target:** Windows-first Tauri 2 desktop app + standalone web preview"
    status_reason: "Stated flatly as the \"Target\", no hedge. Restated in AGENTS.md:53 (\"Tauri 2 desktop app is the primary target; standalone web mode remains a useful preview/fallback\")."

  - id: CORE-03
    title: "Current baseline is repository state \"v5\""
    status: APPROVED
    category: scope
    source: "CODEX_IMPLEMENTATION_BRIEF.md:5"
    quote: "**Current baseline:** repository state named “v5”"
    status_reason: "Declared as the baseline without hedge; AGENTS.md:56 makes a consequence binding (\"Keep a migration path from existing v5 state.\") and CODEX_START_PROMPT.txt:5 requires auditing the current v5 implementation first."

  - id: CORE-04
    title: "Korean is the primary UI language"
    status: APPROVED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:6"
    quote: "**Primary language:** Korean UI"
    status_reason: "Stated as a property of the product, no hedge; AGENTS.md:49 restates it (\"Korean is the primary UI language.\")."

  - id: CORE-05
    title: "Read the brief as a product contract, not a suggestion list"
    status: APPROVED
    category: process
    source: "CODEX_IMPLEMENTATION_BRIEF.md:11"
    quote: "# 0. Read this as a product contract, not a suggestion list"
    status_reason: "Imperative section heading (\"Read this as a product contract, not a suggestion list\"); AGENTS.md:5 restates it as \"It is the product/UX contract for this repository.\""

  - id: CORE-06
    title: "Generic dashboard features are actively harmful here"
    status: APPROVED
    category: scope
    source: "CODEX_IMPLEMENTATION_BRIEF.md:13"
    quote: "This repository is the result of several failed/rejected dashboard experiments. The most important lesson is that **generic dashboard features are actively harmful here**."
    status_reason: "Stated absolutely and in bold (\"actively harmful here\"), with no hedge; AGENTS.md:7 carries the operative form (\"Do not infer missing product requirements from generic dashboard conventions.\")."

  - id: CORE-07
    title: "Product is a vendor-by-vendor calendar assistant, readable immediately, minimal steps"
    status: APPROVED
    category: scope
    source: "CODEX_IMPLEMENTATION_BRIEF.md:15"
    quote: "The user does not want a “management platform” with lots of widgets. The user wants a **vendor-by-vendor calendar assistant** that is readable immediately, and that minimizes the number of steps required to record and advance work."
    status_reason: "\"The user wants\" stated as the product definition inside the section declared to be a contract (line 11); no hedging word. AGENTS.md:11-13 restates the mission and \"The app should reduce cognitive load.\""

  - id: CORE-08
    title: "Rejected: a \"management platform\" with lots of widgets"
    status: REJECTED
    category: scope
    source: "CODEX_IMPLEMENTATION_BRIEF.md:15"
    quote: "The user does not want a “management platform” with lots of widgets."
    status_reason: "Explicit exclusion: \"does not want\". Same sentence as CORE-07; listed separately because it excludes a direction rather than prescribing one."

  - id: CORE-09
    title: "Must feel like a planning calendar + compact helper, not BI/PM/CRM/ERP"
    status: APPROVED
    category: scope
    source: "CODEX_IMPLEMENTATION_BRIEF.md:17"
    quote: "The product must feel closer to a clean planning calendar + compact desktop helper than to a BI dashboard, project-management suite, CRM, or construction ERP."
    status_reason: "\"must feel closer to\" — binding, and it names four excluded product analogues (BI dashboard, project-management suite, CRM, construction ERP). AGENTS.md:44 restates the aesthetic half (\"Work-tool aesthetic, not a decorative consumer dashboard.\")."

  - id: CORE-10
    title: "Main-screen feature filter: the six user questions"
    status: PROVISIONAL
    category: scope
    source: "CODEX_IMPLEMENTATION_BRIEF.md:19-26"
    quote: "If a feature does not directly help the user answer one of these questions, it probably does not belong on the main screen:\n\n1. **Which vendor has something coming up?**\n2. **What exactly is the next thing?**\n3. **On what date?**\n4. **What is on the calendar today/this month?**\n5. **What happened before, and what comes after this step?**\n6. **Can I record the work and move to the next step with minimal effort?**"
    status_reason: "The contract itself hedges the test: \"it probably does not belong on the main screen\" — not \"must not\". The six questions themselves are stated without hedge, but the consequence of failing them is hedged. Compare AGENTS.md:15-17, which states one primary question as binding (\"The primary question the main screen must answer immediately is: 'Which vendor has what coming up, and when?'\")."

  - id: CORE-11
    title: "Operating the tool must not become another job"
    status: APPROVED
    category: scope
    source: "CODEX_IMPLEMENTATION_BRIEF.md:28"
    quote: "The user explicitly said that *operating the tool itself must not become another job*."
    status_reason: "\"must not\" — explicit prohibition, attributed to the user. AGENTS.md:13 restates it in bold: \"**Using the app must not become another job.**\""

  - id: CORE-12
    title: "Do not hardcode domain workflow rules"
    status: APPROVED
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:34"
    quote: "The user appears to be a public-sector employee managing construction-related or vendor-related administrative work. The precise administrative procedure varies, so **do not hardcode domain workflow rules**."
    status_reason: "\"**do not hardcode domain workflow rules**\" — bolded prohibition. (Note the first clause is itself hedged, \"appears to be\", but the obligation is not.)"

  - id: CORE-13
    title: "Seed workflow step names are examples only"
    status: PROVISIONAL
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:36-45"
    quote: "The seed workflow names currently in the repo are examples only:\n\n- 시행계획\n- 청렴이행서약\n- 안전보건수준평가\n- 계약의뢰\n- 계약\n- 착공계 확인\n- 준공계\n- 준공검사"
    status_reason: "The contract labels the list itself \"examples only\", and line 47 adds \"These names are not authoritative policy.\" The names may therefore be seeded but carry no binding force."

  - id: CORE-14
    title: "Procedure templates must be user create/rename/reorder/add/remove/reuse"
    status: APPROVED
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:47"
    quote: "These names are not authoritative policy. The product must allow the user to create, rename, reorder, add, remove, and reuse procedure templates."
    status_reason: "\"The product must allow\" — binding, with six enumerated operations. Hardened by AGENTS.md:38 item 12 (\"Vendor templates/master data and work/procedure templates must be user-editable.\")."
    verify_citation_note: "Primary quote (brief:47) is byte-exact. But the status_reason cites \"AGENTS.md:38 item 12\" — wrong line. AGENTS.md line 37 is item 12 (\"12. Vendor templates/master data and work/procedure templates must be user-editable.\"); line 38 is item 13 (the snapshot rule). Should read AGENTS.md:37 item 12. Note CORE-15's reason correctly cites AGENTS.md:38 item 13, so the two entries currently point at the same line for different items."

  - id: CORE-15
    title: "Seven domain concepts must be kept separate; a vendor may own many works"
    status: APPROVED
    category: data
    source: "CODEX_IMPLEMENTATION_BRIEF.md:49-57"
    quote: "A vendor can have one or more work/project records. The application therefore needs to keep these concepts separate:\n\n- **Vendor/company master/template**\n- **Work/project**\n- **Procedure template**\n- **Procedure-step instance belonging to a specific work/project**\n- **Manual one-off schedule/event**\n- **Work logs**\n- **File attachments**"
    status_reason: "\"needs to keep these concepts separate\" — an obligation on the application, stated without hedge. The separate existence of procedure template vs. procedure-step instance is reinforced by AGENTS.md:38 item 13 (work owns a **snapshot** of its procedure steps)."

  - id: CORE-16
    title: "Must understand what was tried and rejected, and not reintroduce it"
    status: APPROVED
    category: process
    source: "CODEX_IMPLEMENTATION_BRIEF.md:63"
    quote: "Codex must understand what was tried and rejected so it does not reintroduce the same problems."
    status_reason: "\"must understand ... so it does not reintroduce\" — binding. AGENTS.md:7 restates: \"This product has already gone through several rejected UI directions. The repository brief records what the user explicitly wants and what must not be reintroduced.\""

  - id: CORE-17
    title: "Accepted reference structure from the \"Dinosaur Expo\" calendar dashboard"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:65-74"
    quote: "## 2.1 Initial useful reference: “Dinosaur Expo” calendar dashboard\n\nAn earlier unrelated event dashboard had a structure the user liked conceptually:\n\n- summary/control area on the left/top,\n- a calendar as the primary visual surface,\n- vendor/company names visible directly in calendar events,\n- details edited only after clicking,\n- responsive layout,\n- direct manipulation of calendar dates."
    status_reason: "Framed as a reference the user \"liked conceptually\", and line 76 only says the product \"should\" borrow it — softer than must. Three of the six bullets are separately hardened elsewhere: \"vendor/company names visible directly in calendar events\" by §2.4 line 103 and AGENTS.md:23 item 3; \"details edited only after clicking\" by §4.2 line 167 and AGENTS.md:28 item 8; \"a calendar as the primary visual surface\" by §4.2 line 164 and AGENTS.md:21 item 1. \"summary/control area on the left/top\" and \"responsive layout\" and \"direct manipulation of calendar dates\" are not restated as obligations anywhere in this range."

  - id: CORE-18
    title: "Borrow that layout's clarity, not its event-domain content"
    status: PROVISIONAL
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:76"
    quote: "The current work-calendar product should **borrow the clarity of that layout**, not its event-domain content."
    status_reason: "\"should **borrow**\" — hedged relative to the \"must\" clauses elsewhere in the same document. The trailing exclusion (\"not its event-domain content\") is the harder half but is carried by the same \"should\" verb."

  - id: CORE-19
    title: "Rejected direction: card-heavy \"workflow dashboard\""
    status: REJECTED
    category: ui
    source: "CODEX_IMPLEMENTATION_BRIEF.md:78-80"
    quote: "## 2.2 Rejected: card-heavy “workflow dashboard”\n\nRejected because it made the user inspect too many components before understanding the situation."
    status_reason: "Heading says \"Rejected\"; stated reason: \"it made the user inspect too many components before understanding the situation.\""

