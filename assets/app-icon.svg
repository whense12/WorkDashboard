<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Work Calendar Helper 앱 아이콘.
       16px에서도 형태가 유지되도록 가는 선(stroke)을 쓰지 않고 면으로만 구성한다.
       재생성: node tools/make-icons.mjs  (또는 개발 PC에서 cargo tauri icon assets/app-icon.svg) -->
  <rect width="1024" height="1024" rx="228" fill="#285f4b"/>

  <!-- 상단 고리 두 개 -->
  <rect x="300" y="152" width="76" height="152" rx="38" fill="#ffffff"/>
  <rect x="648" y="152" width="76" height="152" rx="38" fill="#ffffff"/>

  <!-- 달력 본체 -->
  <rect x="168" y="240" width="688" height="624" rx="84" fill="#ffffff"/>

  <!-- 머리글 구분선 -->
  <rect x="168" y="392" width="688" height="26" fill="#285f4b" opacity="0.28"/>

  <!-- 날짜 칸 3x2. 마지막 칸만 진하게 = 다가오는 일정 -->
  <g fill="#285f4b">
    <rect x="288" y="486" width="112" height="112" rx="34" opacity="0.28"/>
    <rect x="456" y="486" width="112" height="112" rx="34" opacity="0.28"/>
    <rect x="624" y="486" width="112" height="112" rx="34" opacity="0.28"/>
    <rect x="288" y="654" width="112" height="112" rx="34" opacity="0.28"/>
    <rect x="456" y="654" width="112" height="112" rx="34" opacity="0.28"/>
    <rect x="624" y="654" width="112" height="112" rx="34"/>
  </g>
</svg>
