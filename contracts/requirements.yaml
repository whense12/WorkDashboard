    status_reason: "Item of the \"Do **not** add:\" list opened at line 82; reason at line 95 (\"the system cannot know the true project progress merely from checked steps\"). Restated in AGENTS.md:22 item 2 (\"Do not add KPI cards...\") and again as \"KPI tiles\" in §4.3 line 177."

